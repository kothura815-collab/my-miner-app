<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Alta Ads Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --primary-gold: #f39c12;
            --accent-blue: #0088cc;
            --btn-green: #2fa65a;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        .miner-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            width: 85%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }

        .title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .balance-display {
            font-size: 42px;
            font-weight: bold;
            color: var(--primary-gold);
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(243, 156, 18, 0.3);
        }

        .status {
            font-size: 13px;
            color: #2ec4b6;
            margin-bottom: 25px;
        }

        /* Animated Glowing & Pulsing Logo */
        .logo-container {
            width: 170px;
            height: 170px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            background: linear-gradient(145deg, #0088cc, #f39c12);
            padding: 5px;
            box-shadow: 0 0 20px rgba(0, 136, 204, 0.4);
            cursor: pointer;
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 15px rgba(0, 136, 204, 0.4); transform: scale(1); }
            50% { box-shadow: 0 0 30px rgba(243, 156, 18, 0.8); transform: scale(1.03); }
            100% { box-shadow: 0 0 15px rgba(0, 136, 204, 0.4); transform: scale(1); }
        }

        .logo-inner {
            width: 100%;
            height: 100%;
            background-color: #0b0e14;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Styling for 'A' Logo Icon */
        .logo-icon {
            font-size: 65px;
            font-weight: 900;
            line-height: 1;
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, #0088cc, #f39c12);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: lightning-shake 1.5s infinite;
        }

        @keyframes lightning-shake {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
            20% { transform: scale(1.1) rotate(-5deg); opacity: 0.8; }
            40% { transform: scale(0.95) rotate(5deg); opacity: 1; }
            60% { transform: scale(1.15) rotate(-3deg); filter: drop-shadow(0 0 8px #f39c12); }
            80% { transform: scale(1) rotate(0deg); opacity: 0.9; }
        }

        .logo-text {
            font-size: 14px;
            font-weight: bold;
            color: var(--accent-blue);
            margin-top: 5px;
        }

        .tap-instruction {
            font-size: 14px;
            color: #8b949e;
            margin-bottom: 20px;
        }

        .btn-withdraw {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #27ae60, #2ecc71);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Modal Overlay for Payout Request & Ads */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .payout-card {
            background: #121824;
            border: 2px solid var(--primary-gold);
            border-radius: 16px;
            padding: 20px;
            width: 85%;
            max-width: 320px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .payout-card h3 {
            color: var(--primary-gold);
            margin-top: 0;
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group {
            margin-bottom: 12px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #2a3547;
            background: #090d14;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #27ae60;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .btn-cancel {
            background: transparent;
            border: none;
            color: #8b949e;
            margin-top: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 11px;
            margin-top: 4px;
            display: none;
        }

        /* Ads Modal Style */
        .ad-modal-card {
            background: #161b22;
            border: 2px solid var(--accent-blue);
            border-radius: 16px;
            padding: 30px 20px;
            width: 80%;
            max-width: 300px;
            text-align: center;
        }

        .ad-timer {
            font-size: 36px;
            font-weight: bold;
            color: var(--primary-gold);
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <div class="miner-card">
        <div class="title">Alta Ads Miner</div>
        <div class="balance-display" id="altaBalance">1.00</div>
        <div class="status" id="systemStatus">System: Operational</div>

        <div class="logo-container" id="tapBtn">
            <div class="logo-inner">
                <div class="logo-icon">A</div>
                <div class="logo-text">ALTA HUB</div>
            </div>
        </div>

        <div class="tap-instruction">Tap to mine Alta</div>
        <button class="btn-withdraw" id="openWithdrawModal">Withdraw Alta</button>
    </div>

    <!-- Ads Modal -->
    <div class="modal-overlay" id="adModal">
        <div class="ad-modal-card">
            <h3 style="color: var(--accent-blue); margin: 0;">Watching Sponsor Ad</h3>
            <p style="font-size: 13px; color: #8b949e; margin-top: 5px;">Please wait until the timer finishes...</p>
            <div class="ad-timer" id="adTimer">15</div>
        </div>
    </div>

    <!-- Payout Request Modal -->
    <div class="modal-overlay" id="payoutModal">
        <div class="payout-card">
            <h3>Payout Request</h3>
            
            <div class="input-group">
                <input type="text" id="username" placeholder="@username">
            </div>

            <div class="input-group">
                <input type="number" id="altaAmount" placeholder="Alta Points Amount" readonly>
            </div>

            <div class="input-group">
                <input type="text" id="tonAddress" placeholder="TON Address">
                <div class="error-msg" id="addressError">Invalid TON Address! Must start with UQ or EQ.</div>
            </div>

            <button class="btn-submit" id="submitPayout">SUBMIT REQUEST</button>
            <center><button class="btn-cancel" id="closeModal">Cancel</button></center>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if(tg) tg.expand();

        let currentAlta = 1.00;
        let isAnimating = false;
        let isAdShowing = false;
        let lastTapTime = 0;

        const balanceEl = document.getElementById('altaBalance');
        const tapBtn = document.getElementById('tapBtn');
        const systemStatus = document.getElementById('systemStatus');
        const payoutModal = document.getElementById('payoutModal');
        const adModal = document.getElementById('adModal');
        const adTimerEl = document.getElementById('adTimer');
        
        const openWithdrawModalBtn = document.getElementById('openWithdrawModal');
        const closeModalBtn = document.getElementById('closeModal');
        const submitPayoutBtn = document.getElementById('submitPayout');
        
        const usernameInput = document.getElementById('username');
        const altaAmountInput = document.getElementById('altaAmount');
        const tonAddressInput = document.getElementById('tonAddress');
        const addressError = document.getElementById('addressError');

        // Auto Username fetch from Telegram if available
        if (tg && tg.initDataUnsafe?.user?.username) {
            usernameInput.value = "@" + tg.initDataUnsafe.user.username;
        }

        // Check Online/Offline Status
        function checkNetworkStatus() {
            if (!navigator.onLine) {
                systemStatus.innerText = "System: Offline (Mining Paused)";
                systemStatus.style.color = "#e74c3c";
                return false;
            } else {
                systemStatus.innerText = "System: Operational";
                systemStatus.style.color = "#2ec4b6";
                return true;
            }
        }
        window.addEventListener('online', checkNetworkStatus);
        window.addEventListener('offline', checkNetworkStatus);

        // 15 Seconds Ad Trigger Function
        function trigger15SecAd(onComplete) {
            isAdShowing = true;
            adModal.style.display = 'flex';
            let timeLeft = 15;
            adTimerEl.innerText = timeLeft;

            let adInterval = setInterval(() => {
                timeLeft--;
                adTimerEl.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(adInterval);
                    adModal.style.display = 'none';
                    isAdShowing = false;
                    onComplete();
                }
            }, 1000);
        }

        // Tap Logic with Auto-Clicker Protection & 15s Ads Execution
        tapBtn.addEventListener('click', (e) => {
            // Block if Offline
            if (!checkNetworkStatus()) {
                alert("You are currently offline. Internet connection is required to mine!");
                return;
            }

            if (isAnimating || isAdShowing) return;

            // Anti-Auto-Clicker Checks
            const now = Date.now();
            if (e.isTrusted === false) {
                alert("Automated clicks detected!");
                return;
            }
            if (now - lastTapTime < 500) { // Fast tap limit protection
                return;
            }
            lastTapTime = now;

            isAnimating = true;

            // Trigger Ad and increase balance after completion
            trigger15SecAd(() => {
                let targetAlta = currentAlta + 1.00;
                let step = 0.05;

                let interval = setInterval(() => {
                    currentAlta = parseFloat((currentAlta + step).toFixed(2));
                    balanceEl.innerText = currentAlta.toFixed(2);

                    if (currentAlta >= targetAlta) {
                        clearInterval(interval);
                        currentAlta = targetAlta;
                        balanceEl.innerText = currentAlta.toFixed(2);
                        isAnimating = false;
                    }
                }, 40);
            });
        });

        // Open Modal
        openWithdrawModalBtn.addEventListener('click', () => {
            if (!checkNetworkStatus()) {
                alert("Internet connection required!");
                return;
            }
            altaAmountInput.value = currentAlta.toFixed(2);
            addressError.style.display = 'none';
            payoutModal.style.display = 'flex';
        });

        // Close Modal
        closeModalBtn.addEventListener('click', () => {
            payoutModal.style.display = 'none';
        });

        // TON Address Validation & Submit
        submitPayoutBtn.addEventListener('click', () => {
            const address = tonAddressInput.value.trim();
            const username = usernameInput.value.trim();

            // TON Address format check (UQ... or EQ... with 48 chars length)
            const tonRegex = /^(UQ|EQ)[a-zA-Z0-9_-]{46}$/;

            if (!tonRegex.test(address)) {
                addressError.style.display = 'block';
                return;
            }

            addressError.style.display = 'none';
            alert(`Payout Request Successful!\nUser: ${username}\nAmount: ${currentAlta} ALTA\nAddress: ${address}`);
            
            payoutModal.style.display = 'none';
        });
    </script>
</body>
</html>
