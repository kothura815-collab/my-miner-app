<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Alta Ads Miner</title>

    <meta name="referrer" content="no-referrer-when-downgrade" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --primary-gold: #f39c12;
            --accent-blue: #0088cc;
            --btn-green: #2fa65a;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 15px 0 40px 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        .top-ad-banner-box {
            width: 85%;
            max-width: 380px;
            min-height: 75px;
            margin-bottom: 15px;
            border-radius: 12px;
            overflow: hidden;
            background: #1f293d;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .top-ad-banner-box iframe {
            width: 100% !important;
            height: 75px !important;
            border: none;
            display: block;
        }

        .miner-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            width: 85%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 20px;
        }

        .title { font-size: 22px; font-weight: 800; margin-bottom: 5px; }

        .balance-display {
            font-size: 38px;
            font-weight: bold;
            color: var(--primary-gold);
            margin: 5px 0;
            text-shadow: 0 0 10px rgba(243, 156, 18, 0.3);
        }

        .status { font-size: 13px; color: #2ec4b6; margin-bottom: 12px; }

        .logo-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 12px auto;
            border-radius: 50%;
            padding: 5px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(243, 156, 18, 0.4);
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 15px rgba(0, 136, 204, 0.4); transform: scale(1); }
            50% { box-shadow: 0 0 30px rgba(243, 156, 18, 0.8); transform: scale(1.03); }
            100% { box-shadow: 0 0 15px rgba(0, 136, 204, 0.4); transform: scale(1); }
        }

        .coin-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .logo-container.mining .coin-img { animation: spin-coin 1s linear infinite; }

        @keyframes spin-coin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .tap-instruction { font-size: 13px; color: #8b949e; margin-bottom: 12px; }

        .btn-double-ad-main {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #e67e22, #f39c12);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            box-shadow: 0 4px 12px rgba(243, 156, 18, 0.3);
        }

        .btn-double-ad-main:active { transform: scale(0.98); }

        .btn-withdraw, .btn-share {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .btn-withdraw { background: linear-gradient(90deg, #27ae60, #2ecc71); }
        .btn-share { background: linear-gradient(90deg, #0088cc, #3498db); }

        .ads-feed-container {
            width: 85%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .ad-card-item {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            cursor: pointer;
            position: relative;
        }

        .ad-card-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        .ad-card-item .ad-caption {
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            color: #ffffff;
        }

        .bottom-ad-rotate-box {
            width: 100%;
            min-height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bottom-ad-rotate-box iframe { width: 100%; height: 120px; border: none; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 17, 23, 0.96);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 15px;
            box-sizing: border-box;
            z-index: 1000;
        }

        .modal-top-banner {
            width: 100%;
            max-width: 340px;
            min-height: 75px;
            background: #161b22;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2a3547;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-top-banner iframe { width: 100% !important; height: 75px !important; border: 0; }

        .ad-modal-content {
            width: 100%;
            max-width: 340px;
            height: 220px;
            background: #161b22;
            border-radius: 16px;
            border: 1px solid #21262d;
            margin: auto 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ad-modal-content iframe { width: 100%; height: 100%; border: none; }

        .btn-continue {
            width: 100%;
            max-width: 340px;
            padding: 14px;
            background: #234b6e;
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-continue.active {
            background: #0088cc;
            opacity: 1;
            cursor: pointer;
        }

        .toast-popup {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f293d;
            color: #fff;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid var(--primary-gold);
            display: none;
            z-index: 2000;
            text-align: center;
            max-width: 85%;
        }
    </style>
</head>
<body>

    <div class="top-ad-banner-box" id="topAdRotateBox"></div>

    <div class="miner-card">
        <div class="title">Alta Ads Miner</div>
        <div class="balance-display" id="altaBalance">0.00</div>
        <div class="status" id="systemStatus">System: Operational</div>

        <div class="logo-container" id="tapBtn">
            <img src="alta-coin.png" alt="Alta Coin" class="coin-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/6001/6001368.png'">
        </div>

        <div class="tap-instruction" id="tapInstruction">Tap to mine Alta again!</div>

        <button class="btn-double-ad-main" id="doubleAdsBtn">
            ⚡ Double Ads 15s (+0.5 ALTA)
        </button>

        <button class="btn-withdraw" id="openWithdrawModal">Withdraw Alta (Min: 150 ALTA)</button>
        <button class="btn-share" id="shareBtn">Invite Friend (+5 ALTA Each)</button>
    </div>

    <!-- P1 Ads Feed Section Direct Link Trigger -->
    <div class="ads-feed-container">
        <div class="ad-card-item" onclick="openCpmDirectLink()">
            <img src="https://images.unsplash.com/photo-1518609878373-06d740f60d8b?w=500" alt="Crypto Games">
            <div class="ad-caption">Crypto Roulette! Play Now!</div>
        </div>

        <div class="ad-card-item" onclick="openCpmDirectLink()">
            <img src="https://images.unsplash.com/photo-1596838132731-3301c3fd4317?w=500" alt="Casino Offer">
            <div class="ad-caption">€10 deposit, €670 withdrawal. Get started now</div>
        </div>

        <div class="ad-card-item" onclick="openCpmDirectLink()">
            <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=500" alt="Stream Online">
            <div class="ad-caption">No Time to Die: Stream online</div>
        </div>

        <div class="ad-card-item" onclick="openCpmDirectLink()">
            <img src="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=500" alt="Watch Sports">
            <div class="ad-caption">Watch Champions League For Free</div>
        </div>

        <div class="ad-card-item" style="padding: 10px 0;">
            <div class="bottom-ad-rotate-box" id="bottomAdRotateBox"></div>
        </div>
    </div>

    <!-- 15s Modal -->
    <div class="modal-overlay" id="adModal">
        <div class="modal-top-banner" id="modalTopAdBox"></div>
        <div class="ad-modal-content">
            <iframe src="//acceptable.a-ads.com/2454008/?size=300x250" style="border:0; width:100%; height:100%; overflow:hidden;"></iframe>
        </div>
        <button class="btn-continue" id="continueAdBtn" disabled>Please wait 15s...</button>
    </div>

    <div class="toast-popup" id="customToast"></div>

    <script>
        const tg = window.Telegram?.WebApp;
        if(tg) tg.expand();

        let currentAlta = parseFloat(localStorage.getItem('alta_balance') || '0.00');
        let isMining = false;
        let isAdShowing = false;
        let lastTapTime = 0;
        let adStartTime = 0;

        const balanceEl = document.getElementById('altaBalance');
        balanceEl.innerText = currentAlta.toFixed(2);

        const tapBtn = document.getElementById('tapBtn');
        const tapInstruction = document.getElementById('tapInstruction');
        const adModal = document.getElementById('adModal');
        const continueAdBtn = document.getElementById('continueAdBtn');
        const doubleAdsBtn = document.getElementById('doubleAdsBtn');
        const customToast = document.getElementById('customToast');

        // HIGH CPM DIRECT LINKS
        const highCpmLinks = [
            'https://mammothsubway.com/rbuwwr1xk?key=f2d3ee3d88106cf8c9baceb9d7fa460a',
            'https://plump-plastic.com/PEwa43',
            'https://plump-plastic.com/b.3gVr0JP/3xpYvYbOmGVwJLZ_D/0C3nM/zvYY3sM/zzAo1/LSTdckzvNGjvc/z/M_DmkL',
            'https://www.youtube.com/@AltaHubOfficial'
        ];

        let linkIdx = 0;
        function getHighCpmLink() {
            const url = highCpmLinks[linkIdx];
            linkIdx = (linkIdx + 1) % highCpmLinks.length;
            return url;
        }

        // Click Ads Item Trigger Direct Link
        function openCpmDirectLink() {
            window.open(getHighCpmLink(), '_blank');
        }

        // Auto Rotating Banners
        const rotateAdSources = [
            "//acceptable.a-ads.com/2454008/?size=Adaptive",
            "//acceptable.a-ads.com/2454008/?size=468x60",
            "https://mammothsubway.com/rbuwwr1xk?key=f2d3ee3d88106cf8c9baceb9d7fa460a"
        ];
        let currentAdIndex = 0;

        function updateRotatingBanner() {
            const topAdBox = document.getElementById('topAdRotateBox');
            const bottomAdBox = document.getElementById('bottomAdRotateBox');
            const modalTopBox = document.getElementById('modalTopAdBox');
            
            const nextSrc = rotateAdSources[currentAdIndex];
            const iframeHtml = `<iframe src="${nextSrc}" style="border:0; width:100%; height:100%; overflow:hidden;" scrolling="no"></iframe>`;

            if(topAdBox) topAdBox.innerHTML = iframeHtml;
            if(bottomAdBox) bottomAdBox.innerHTML = iframeHtml;
            if(modalTopBox) modalTopBox.innerHTML = iframeHtml;

            currentAdIndex = (currentAdIndex + 1) % rotateAdSources.length;
        }
        updateRotatingBanner();
        setInterval(updateRotatingBanner, 6000);

        function showNotification(msg) {
            customToast.innerText = msg;
            customToast.style.display = 'block';
            setTimeout(() => { customToast.style.display = 'none'; }, 3500);
        }

        function saveBalance() {
            localStorage.setItem('alta_balance', currentAlta.toString());
            balanceEl.innerText = currentAlta.toFixed(2);
        }

        // Tap Mining Logic
        tapBtn.addEventListener('click', (e) => {
            const currentTime = new Date().getTime();
            if ((currentTime - lastTapTime < 350) || !e.isTrusted) return;
            lastTapTime = currentTime;

            if (isMining || isAdShowing) return;

            window.open(getHighCpmLink(), '_blank');

            isMining = true;
            tapBtn.classList.add('mining');
            tapInstruction.innerText = "Mining Alta in progress (10s)...";

            let stepCount = 0;
            let interval = setInterval(() => {
                stepCount++;
                currentAlta = parseFloat((currentAlta + 0.05).toFixed(2));
                saveBalance();

                if (stepCount >= 20) {
                    clearInterval(interval);
                    tapBtn.classList.remove('mining');
                    isMining = false;

                    trigger15SecModalAd();
                }
            }, 500);
        });

        // 15s Modal Display Logic
        function trigger15SecModalAd() {
            isAdShowing = true;
            adModal.style.display = 'flex';
            continueAdBtn.disabled = true;
            continueAdBtn.classList.remove('active');
            continueAdBtn.innerText = "Please wait 15s...";

            let timeLeft = 15;
            let adInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(adInterval);
                    continueAdBtn.disabled = false;
                    continueAdBtn.classList.add('active');
                    continueAdBtn.innerText = "Continue Mining";
                } else {
                    continueAdBtn.innerText = `Please wait ${timeLeft}s...`;
                }
            }, 1000);
        }

        // Continue Mining Click
        continueAdBtn.addEventListener('click', () => {
            if (!continueAdBtn.disabled) {
                window.open(getHighCpmLink(), '_blank');
                adModal.style.display = 'none';
                isAdShowing = false;
                tapInstruction.innerText = "Tap to mine Alta again!";
            }
        });

        // Double Ads 15s Click System
        doubleAdsBtn.addEventListener('click', () => {
            adStartTime = Date.now();
            window.open(getHighCpmLink(), "_blank");
        });

        window.addEventListener('focus', () => {
            if (adStartTime > 0) {
                const elapsedSeconds = Math.floor((Date.now() - adStartTime) / 1000);
                adStartTime = 0;

                if (elapsedSeconds >= 15) {
                    currentAlta = parseFloat((currentAlta + 0.50).toFixed(2));
                    saveBalance();
                    showNotification("15s Verified! +0.50 ALTA added to balance!");
                } else {
                    showNotification(`Viewed for ${elapsedSeconds}s only! Must stay full 15s to claim +0.5 ALTA.`);
                }
            }
        });
    </script>
</body>
</html>
