<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Alta Ads Miner</title>

    <!-- Adsterra Active Ads Scripts (Popunder & Social Bar) -->
    <script src="https://pl31061771.profitableratecpmnetwork.com/fd/70/b7/fd70b725a39e47afacb097f9e85d8686.js"></script>
    <script src="https://pl31061772.profitableratecpmnetwork.com/03/56/27/035627b96d5624664694e5fe7a705c05.js"></script>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --primary-gold: #f39c12;
            --accent-blue: #0088cc;
            --btn-green: #2fa65a;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 15px 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        .miner-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            width: 85%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            margin: auto 0;
        }

        .title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .balance-display {
            font-size: 40px;
            font-weight: bold;
            color: var(--primary-gold);
            margin: 5px 0;
            text-shadow: 0 0 10px rgba(243, 156, 18, 0.3);
        }

        .status {
            font-size: 13px;
            color: #2ec4b6;
            margin-bottom: 15px;
        }

        .logo-container {
            width: 150px;
            height: 150px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            padding: 5px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 0 20px rgba(243, 156, 18, 0.4);
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 15px rgba(0, 136, 204, 0.4); transform: scale(1); }
            50% { box-shadow: 0 0 30px rgba(243, 156, 18, 0.8); transform: scale(1.03); }
            100% { box-shadow: 0 0 15px rgba(0, 136, 204, 0.4); transform: scale(1); }
        }

        .coin-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .logo-container.mining .coin-img {
            animation: spin-coin 3s linear infinite;
        }

        @keyframes spin-coin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .tap-instruction {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 15px;
        }

        .btn-withdraw {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #27ae60, #2ecc71);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 15 Sec Fullscreen Sponsor Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 17, 23, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            z-index: 1000;
        }

        .ad-timer-badge {
            background: #1c2738;
            color: #0088cc;
            padding: 6px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            border: 1px solid rgba(0, 136, 204, 0.3);
        }

        .ad-modal-content {
            width: 100%;
            max-width: 350px;
            background: #161b22;
            border-radius: 16px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border: 1px solid #21262d;
        }

        .btn-continue {
            width: 100%;
            padding: 14px;
            background: #234b6e;
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            cursor: not-allowed;
            opacity: 0.6;
            transition: all 0.3s ease;
        }

        .btn-continue.active {
            background: #0088cc;
            opacity: 1;
            cursor: pointer;
        }

        /* Payout Modal */
        .payout-card {
            background: #121824;
            border: 2px solid var(--primary-gold);
            border-radius: 16px;
            padding: 20px;
            width: 85%;
            max-width: 320px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #2a3547;
            background: #090d14;
            color: #fff;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #27ae60;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Main Miner Card -->
    <div class="miner-card">
        <div class="title">Alta Ads Miner</div>
        <div class="balance-display" id="altaBalance">0.00</div>
        <div class="status" id="systemStatus">System: Operational</div>

        <div class="logo-container" id="tapBtn">
            <img src="alta-coin.png" alt="Alta Coin" class="coin-img">
        </div>

        <div class="tap-instruction" id="tapInstruction">Tap to start mining Alta</div>
        <button class="btn-withdraw" id="openWithdrawModal">Withdraw Alta</button>
    </div>

    <!-- 15 Sec Sponsor Ad Modal -->
    <div class="modal-overlay" id="adModal">
        <div class="ad-timer-badge">
            <span id="adTimer">00:15</span>
        </div>

        <div class="ad-modal-content">
            <h3 style="margin: 0 0 10px 0; color: #0088cc;">Sponsor Advertisement</h3>
            <p style="font-size: 13px; color: #8b949e; margin: 0 0 10px 0;">Ads are active. Please interact or wait to claim rewards.</p>
        </div>

        <button class="btn-continue" id="continueAdBtn" disabled>Please wait...</button>
    </div>

    <!-- Payout Request Modal -->
    <div class="modal-overlay" id="payoutModal" style="justify-content: center;">
        <div class="payout-card">
            <h3 style="color: var(--primary-gold); margin-top:0;">Payout Request</h3>
            <div class="input-group"><input type="text" id="username" placeholder="@username"></div>
            <div class="input-group"><input type="number" id="altaAmount" placeholder="Alta Points" readonly></div>
            <div class="input-group">
                <input type="text" id="tonAddress" placeholder="TON Address">
                <div style="color: #e74c3c; font-size: 11px; display: none;" id="addressError">Invalid TON Address!</div>
            </div>
            <button class="btn-submit" id="submitPayout">SUBMIT REQUEST</button>
            <center><button style="background:none; border:none; color:#8b949e; margin-top:10px;" id="closeModal">Cancel</button></center>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if(tg) tg.expand();

        const BOT_TOKEN = "8600671562:AAFYO8KewkhoCIrw_wxvfoEQvfFF4EW5iLw"; 
        const CHANNEL_ID = "@AltaHub_ads_withdraw_history";

        let currentAlta = 0.00;
        let isMining = false;
        let isAdShowing = false;

        const balanceEl = document.getElementById('altaBalance');
        const tapBtn = document.getElementById('tapBtn');
        const tapInstruction = document.getElementById('tapInstruction');
        const payoutModal = document.getElementById('payoutModal');
        const adModal = document.getElementById('adModal');
        const adTimerEl = document.getElementById('adTimer');
        const continueAdBtn = document.getElementById('continueAdBtn');

        // 15-second Ad Logic
        function trigger15SecAd(onComplete) {
            isAdShowing = true;
            adModal.style.display = 'flex';
            continueAdBtn.disabled = true;
            continueAdBtn.classList.remove('active');
            continueAdBtn.innerText = "Please wait...";

            let timeLeft = 15;
            adTimerEl.innerText = `00:${timeLeft < 10 ? '0' : ''}${timeLeft}`;

            let adInterval = setInterval(() => {
                timeLeft--;
                adTimerEl.innerText = `00:${timeLeft < 10 ? '0' : ''}${timeLeft}`;
                
                if (timeLeft <= 0) {
                    clearInterval(adInterval);
                    continueAdBtn.disabled = false;
                    continueAdBtn.classList.add('active');
                    continueAdBtn.innerText = "Continue";
                }
            }, 1000);

            continueAdBtn.onclick = () => {
                if (!continueAdBtn.disabled) {
                    adModal.style.display = 'none';
                    isAdShowing = false;
                    onComplete();
                }
            };
        }

        // Tap & Mining Logic
        tapBtn.addEventListener('click', (e) => {
            if (isMining || isAdShowing) return;

            isMining = true;
            tapBtn.classList.add('mining');
            tapInstruction.innerText = "Mining Alta in progress...";

            let targetAlta = currentAlta + 1.00;
            let totalSteps = 20; 
            let stepInterval = 10000 / totalSteps;

            let stepCount = 0;
            let interval = setInterval(() => {
                stepCount++;
                currentAlta = parseFloat((currentAlta + 0.05).toFixed(2));
                balanceEl.innerText = currentAlta.toFixed(2);

                if (stepCount >= totalSteps) {
                    clearInterval(interval);
                    currentAlta = parseFloat(targetAlta.toFixed(2));
                    balanceEl.innerText = currentAlta.toFixed(2);
                    tapBtn.classList.remove('mining');
                    isMining = false;

                    trigger15SecAd(() => {
                        tapInstruction.innerText = "Tap to mine Alta again!";
                    });
                }
            }, stepInterval);
        });

        // Withdraw Logic
        document.getElementById('openWithdrawModal').addEventListener('click', () => {
            if (currentAlta <= 0) { alert("Balance is 0!"); return; }
            document.getElementById('altaAmount').value = currentAlta.toFixed(2);
            payoutModal.style.display = 'flex';
        });

        document.getElementById('closeModal').addEventListener('click', () => {
            payoutModal.style.display = 'none';
        });
    </script>
</body>
</html>
