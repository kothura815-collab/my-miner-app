    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --primary-gold: #f39c12;
            --accent-blue: #0088cc;
            --btn-green: #2fa65a;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 15px 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        .ad-banner-top {
            width: 90%;
            max-width: 380px;
            min-height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(22, 27, 34, 0.7);
            border: 1px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .miner-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            width: 85%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }

        .title { font-size: 22px; font-weight: 800; margin-bottom: 5px; }

        .balance-display {
            font-size: 40px;
            font-weight: bold;
            color: var(--primary-gold);
            margin: 5px 0;
            text-shadow: 0 0 10px rgba(243, 156, 18, 0.3);
        }

        .status { font-size: 13px; color: #2ec4b6; margin-bottom: 15px; }

        .logo-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            padding: 5px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 0 20px rgba(243, 156, 18, 0.4);
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 15px rgba(0, 136, 204, 0.4); transform: scale(1); }
            50% { box-shadow: 0 0 30px rgba(243, 156, 18, 0.8); transform: scale(1.03); }
            100% { box-shadow: 0 0 15px rgba(0, 136, 204, 0.4); transform: scale(1); }
        }

        .coin-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        .logo-container.mining .coin-img { animation: spin-coin 3s linear infinite; }

        @keyframes spin-coin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .tap-instruction { font-size: 13px; color: #8b949e; margin-bottom: 15px; }

        .btn-withdraw, .btn-share {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .btn-withdraw { background: linear-gradient(90deg, #27ae60, #2ecc71); }
        .btn-share { background: linear-gradient(90deg, #0088cc, #3498db); }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 17, 23, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 15px;
            box-sizing: border-box;
            z-index: 1000;
        }

        .ad-timer-badge {
            background: #1c2738;
            color: #0088cc;
            padding: 6px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 15px;
            border: 1px solid rgba(0, 136, 204, 0.3);
        }

        .ad-modal-content {
            width: 100%;
            max-width: 340px;
            background: #161b22;
            border-radius: 16px;
            padding: 15px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border: 1px solid #21262d;
        }

        .ad-box-frame {
            width: 100%;
            height: 280px;
            background: #090d14;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .btn-continue {
            width: 100%;
            max-width: 340px;
            padding: 14px;
            background: #234b6e;
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            cursor: not-allowed;
            opacity: 0.6;
            transition: all 0.3s ease;
        }

        .btn-continue.active {
            background: #0088cc;
            opacity: 1;
            cursor: pointer;
        }

        .payout-card {
            background: #121824;
            border: 2px solid var(--primary-gold);
            border-radius: 16px;
            padding: 20px;
            width: 85%;
            max-width: 320px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #2a3547;
            background: #090d14;
            color: #fff;
            box-sizing: border-box;
            margin-bottom: 8px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #27ae60;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .toast-popup {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f293d;
            color: #fff;
            padding: 14px 24px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid var(--primary-gold);
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
            display: none;
            z-index: 2000;
            text-align: center;
            max-width: 85%;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 11px;
            margin-bottom: 8px;
            display: none;
            text-align: left;
        }
    </style>
</head>
<body>

    <!-- Top High-CPM Ad Slot -->
    <div class="ad-banner-top" id="topAdSlot">
        <div id="frame" style="width: 100%; margin: auto; position: relative;">
            <iframe data-aa='2453653' src='https://acceptable.a-ads.com/2453653/?size=Adaptive' style='border:0; padding:0; width:100%; height:90px; overflow:hidden; display: block; margin: auto;'></iframe>
        </div>
    </div>

    <!-- Main Miner Card -->
    <div class="miner-card">
        <div class="title">Alta Ads Miner</div>
        <div class="balance-display" id="altaBalance">0.00</div>
        <div class="status" id="systemStatus">System: Operational</div>

        <div class="logo-container" id="tapBtn">
            <img src="alta-coin.png" alt="Alta Coin" class="coin-img">
        </div>

        <div class="tap-instruction" id="tapInstruction">Tap to start mining Alta</div>
        <button class="btn-withdraw" id="openWithdrawModal">Withdraw Alta (Max: 1000/Day)</button>
        <button class="btn-share" id="shareBtn">Invite Friend (+5 ALTA Each)</button>
    </div>

    <!-- Continuous Sponsor Ads Modal -->
    <div class="modal-overlay" id="adModal">
        <div class="ad-timer-badge">
            <span id="adTimer">00:20</span>
        </div>

        <div class="ad-modal-content">
            <div class="ad-box-frame" id="adBoxContainer"></div>
        </div>

        <button class="btn-continue" id="continueAdBtn" disabled>Please wait...</button>
    </div>

    <!-- Payout Request Modal -->
    <div class="modal-overlay" id="payoutModal" style="justify-content: center;">
        <div class="payout-card">
            <h3 style="color: var(--primary-gold); margin-top:0; text-align:center;">Withdrawal Request</h3>
            
            <div class="input-group">
                <input type="text" id="username" placeholder="Telegram Username (@user)">
                <div class="error-msg" id="userError">Valid Telegram username required (@username)!</div>
            </div>

            <div class="input-group">
                <input type="number" id="altaAmount" placeholder="Alta Points (Max 1000)" readonly>
            </div>

            <div class="input-group">
                <input type="text" id="tonAddress" placeholder="TON Wallet Address">
                <div class="error-msg" id="addressError">Invalid TON address! Must start with UQ or EQ.</div>
            </div>

            <button class="btn-submit" id="submitPayout">SUBMIT WITHDRAWAL</button>
            <center><button style="background:none; border:none; color:#8b949e; margin-top:10px; cursor:pointer;" id="closeModal">Cancel</button></center>
        </div>
    </div>

    <div class="toast-popup" id="customToast"></div>

    <script>
        const tg = window.Telegram?.WebApp;
        if(tg) tg.expand();

        const BOT_TOKEN = "8600671562:AAFYO8KewkhoCIrw_wxvfoEQvfFF4EW5iLw"; 
        const CHANNEL_ID = "@AltaHub_ads_withdraw_history";
        const MIN_WITHDRAW = 50.00;
        const DAILY_MAX_WITHDRAW = 1000.00;

        let currentAlta = parseFloat(localStorage.getItem('alta_balance') || '0.00');
        let adIndex = 0;
        let isMining = false;
        let isAdShowing = false;
        let lastTapTime = 0;

        const balanceEl = document.getElementById('altaBalance');
        balanceEl.innerText = currentAlta.toFixed(2);

        const tapBtn = document.getElementById('tapBtn');
        const tapInstruction = document.getElementById('tapInstruction');
        const payoutModal = document.getElementById('payoutModal');
        const adModal = document.getElementById('adModal');
        const adTimerEl = document.getElementById('adTimer');
        const continueAdBtn = document.getElementById('continueAdBtn');
        const adBoxContainer = document.getElementById('adBoxContainer');

        const openWithdrawModalBtn = document.getElementById('openWithdrawModal');
        const closeModalBtn = document.getElementById('closeModal');
        const submitPayoutBtn = document.getElementById('submitPayout');
        const shareBtn = document.getElementById('shareBtn');
        
        const usernameInput = document.getElementById('username');
        const altaAmountInput = document.getElementById('altaAmount');
        const tonAddressInput = document.getElementById('tonAddress');
        const addressError = document.getElementById('addressError');
        const userError = document.getElementById('userError');
        const customToast = document.getElementById('customToast');

        if (tg && tg.initDataUnsafe?.user?.username) {
            usernameInput.value = "@" + tg.initDataUnsafe.user.username;
        }

        function showNotification(msg) {
            customToast.innerText = msg;
            customToast.style.display = 'block';
            setTimeout(() => { customToast.style.display = 'none'; }, 3500);
        }

        function saveBalance() {
            localStorage.setItem('alta_balance', currentAlta.toString());
            balanceEl.innerText = currentAlta.toFixed(2);
        }

        function getTodayDateString() {
            const today = new Date();
            return `${today.getFullYear()}-${today.getMonth() + 1}-${today.getDate()}`;
        }

        function getDailyWithdrawnAmount() {
            const savedData = JSON.parse(localStorage.getItem('daily_withdraw_tracker') || '{}');
            if (savedData.date === getTodayDateString()) {
                return savedData.amount || 0;
            }
            return 0;
        }

        function addDailyWithdrawnAmount(amount) {
            const todayStr = getTodayDateString();
            const currentDaily = getDailyWithdrawnAmount();
            localStorage.setItem('daily_withdraw_tracker', JSON.stringify({
                date: todayStr,
                amount: currentDaily + amount
            }));
        }

        // High-Paying Gaming & Crypto Offer Streams
        const adsList = [
            { type: 'iframe', src: 'https://acceptable.a-ads.com/2453653/?size=Adaptive' },
            { type: 'iframe', src: 'https://acceptable.a-ads.com/2453769/?size=Adaptive' },
            { type: 'embed', src: 'https://plump-plastic.com/bA3OV.0fPz3OpKv_bPmxVCJ/Z-Ds0P3IMLzqY/1vMmjAYM5/LBTTc/zMNtj/UryzNEzVMy' },
            { type: 'embed', src: 'https://www.profitableratecpmnetwork.com/x18ziza6?key=b5e077d7dc21f4b333cf83484676dc43' }
        ];

        function renderNextAd() {
            adBoxContainer.innerHTML = '';
            let currentAd = adsList[adIndex];

            const iframe = document.createElement('iframe');
            iframe.src = currentAd.src;
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.style.border = '0';
            iframe.style.overflow = 'hidden';
            
            adBoxContainer.appendChild(iframe);
            adIndex = (adIndex + 1) % adsList.length;
        }

        function trigger20SecAdStream(onComplete) {
            isAdShowing = true;
            adModal.style.display = 'flex';
            continueAdBtn.disabled = true;
            continueAdBtn.classList.remove('active');
            continueAdBtn.innerText = "Please wait...";

            renderNextAd();
            let timeLeft = 20;
            adTimerEl.innerText = `00:${timeLeft < 10 ? '0' : ''}${timeLeft}`;

            let adInterval = setInterval(() => {
                if (!navigator.onLine) {
                    showNotification("Internet disconnected! Ad stream paused.");
                    clearInterval(adInterval);
                    adModal.style.display = 'none';
                    isAdShowing = false;
                    return;
                }

                timeLeft--;
                adTimerEl.innerText = `00:${timeLeft < 10 ? '0' : ''}${timeLeft}`;
                
                if (timeLeft % 20 === 0 && timeLeft > 0) {
                    renderNextAd();
                }

                if (timeLeft <= 0) {
                    clearInterval(adInterval);
                    continueAdBtn.disabled = false;
                    continueAdBtn.classList.add('active');
                    continueAdBtn.innerText = "Continue Mining";
                }
            }, 1000);

            continueAdBtn.onclick = () => {
                if (!continueAdBtn.disabled) {
                    adModal.style.display = 'none';
                    isAdShowing = false;
                    onComplete();
                }
            };
        }

        tapBtn.addEventListener('click', (e) => {
            if (!navigator.onLine) {
                showNotification("Internet connection required to mine!");
                return;
            }

            const currentTime = new Date().getTime();
            if ((currentTime - lastTapTime < 300) || !e.isTrusted) {
                showNotification("Auto-Clicker detected! Manual tap required.");
                return;
            }
            lastTapTime = currentTime;

            if (isMining || isAdShowing) return;

            isMining = true;
            tapBtn.classList.add('mining');
            tapInstruction.innerText = "Mining Alta in progress...";

            let targetAlta = currentAlta + 1.00;
            let totalSteps = 20; 
            let stepInterval = 500;

            let stepCount = 0;
            let interval = setInterval(() => {
                if (!navigator.onLine) {
                    clearInterval(interval);
                    tapBtn.classList.remove('mining');
                    isMining = false;
                    showNotification("Internet lost! Mining stopped.");
                    return;
                }

                stepCount++;
                currentAlta = parseFloat((currentAlta + 0.05).toFixed(2));
                saveBalance();

                if (stepCount >= totalSteps) {
                    clearInterval(interval);
                    currentAlta = parseFloat(targetAlta.toFixed(2));
                    saveBalance();
                    tapBtn.classList.remove('mining');
                    isMining = false;

                    trigger20SecAdStream(() => {
                        tapInstruction.innerText = "Tap to mine Alta again!";
                    });
                }
            }, stepInterval);
        });

        shareBtn.addEventListener('click', () => {
            let userId = tg?.initDataUnsafe?.user?.id || "user";
            let botUsername = "AltaHub_ads_bot";
            let refLink = `https://t.me/${botUsername}?start=${userId}`;
            
            if (tg) {
                tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=${encodeURIComponent("Join Alta Ads Miner & claim +5 ALTA bonus!")}`);
            } else {
                navigator.clipboard.writeText(refLink);
                showNotification("Referral link copied: " + refLink);
            }
        });

        openWithdrawModalBtn.addEventListener('click', () => {
            const todayWithdrawn = getDailyWithdrawnAmount();

            if (todayWithdrawn >= DAILY_MAX_WITHDRAW) {
                showNotification("Daily withdrawal limit reached (1000 ALTA/day). Try again tomorrow!");
                return;
            }

            if (currentAlta < MIN_WITHDRAW) {
                showNotification(`Minimum withdrawal amount is ${MIN_WITHDRAW} ALTA. Current balance: ${currentAlta.toFixed(2)} ALTA`);
                return;
            }

            let availableWithdraw = Math.min(currentAlta, DAILY_MAX_WITHDRAW - todayWithdrawn);
            altaAmountInput.value = availableWithdraw.toFixed(2);

            addressError.style.display = 'none';
            userError.style.display = 'none';
            payoutModal.style.display = 'flex';
        });

        closeModalBtn.addEventListener('click', () => {
            payoutModal.style.display = 'none';
        });

        submitPayoutBtn.addEventListener('click', async () => {
            const address = tonAddressInput.value.trim();
            const username = usernameInput.value.trim();

            const tonRegex = /^(UQ|EQ)[a-zA-Z0-9_-]{46}$/;
            const userRegex = /^@[a-zA-Z0-9_]{3,32}$/;

            let isValid = true;

            if (!userRegex.test(username)) {
                userError.style.display = 'block';
                isValid = false;
            } else {
                userError.style.display = 'none';
            }

            if (!tonRegex.test(address)) {
                addressError.style.display = 'block';
                isValid = false;
            } else {
                addressError.style.display = 'none';
            }

            if (!isValid) return;

            let withdrawAmount = parseFloat(altaAmountInput.value);

            currentAlta -= withdrawAmount;
            if (currentAlta < 0) currentAlta = 0;
            saveBalance();

            addDailyWithdrawnAmount(withdrawAmount);

            const message = `<b>New Payout Request</b>\n\n` +
                            `<b>User:</b> ${username}\n` +
                            `<b>Amount:</b> ${withdrawAmount.toFixed(2)} ALTA\n` +
                            `<b>TON Address:</b> <code>${address}</code>\n` +
                            `<b>Status:</b> Pending`;

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHANNEL_ID, text: message, parse_mode: 'HTML' })
                });
            } catch (err) { console.error(err); }

            showNotification(`Requested: ${withdrawAmount.toFixed(2)} ALTA. Daily limit updated.`);
            payoutModal.style.display = 'none';

            if (tg) tg.openTelegramLink("https://t.me/AltaHub_ads_withdraw_history");
            else window.open("https://t.me/AltaHub_ads_withdraw_history", "_blank");
        });
    </script>
</body>
</html>
