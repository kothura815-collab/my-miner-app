    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --primary-gold: #f39c12;

        body {
            margin: 0;

        .ad-video-banner-top {

            height: 140px;

            margin-bottom: 15px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .ad-video-banner-top video {
            width: 100%;

        .video-tag {
            position: absolute;

            background: rgba(0,0,0,0.7);

        .miner-card {
            background: var(--card-bg);

            margin-bottom: 20px;
        }

        .title { font-size: 22px; font-weight: 800; margin-bottom: 5px; }

        .balance-display {
            font-size: 38px;
            font-weight: bold;
            color: var(--primary-gold);
            margin: 5px 0;
            text-shadow: 0 0 10px rgba(243, 156, 18, 0.3);
        }

        .status { font-size: 13px; color: #2ec4b6; margin-bottom: 12px; }

        .logo-container {
            width: 110px;
            height: 110px;
            margin: 0 auto 12px auto;
            border-radius: 50%;
            padding: 5px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(243, 156, 18, 0.4);
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 15px rgba(0, 136, 204, 0.4); transform: scale(1); }
            50% { box-shadow: 0 0 25px rgba(243, 156, 18, 0.8); transform: scale(1.03); }
            100% { box-shadow: 0 0 15px rgba(0, 136, 204, 0.4); transform: scale(1); }

<body>

    <div class="ad-video-banner-top">
        <video id="topBannerVideo" autoplay muted loop playsinline></video>
        <div class="video-tag">High Revenue Ad</div>
    </div>

    <div class="miner-card">
        <div class="title">Alta Ads Miner</div>
        <div class="balance-display" id="altaBalance">54.15</div>
        <div class="status">System: Operational</div>

        <div class="logo-container" id="tapBtn">
            <img src="alta-coin.png" alt="Alta Coin" class="coin-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/6001/6001368.png'">
        </div>

        <div style="font-size: 13px; color: #8b949e; margin-bottom: 12px;">Tap to mine Alta again!</div>

        <button class="btn-double-ad-main" id="doubleAdsBtn">
            ⚡ Double Ads 15s (+0.5 ALTA)
        </button>

        <button class="btn-withdraw" id="openWithdrawModal">Withdraw Alta (Min: 150 ALTA)</button>
        <button class="btn-share" id="shareBtn">Invite Friend (+5 ALTA Each)</button>
    </div>

    <!-- Ad Units Section -->
    <div class="ads-feed-container">
        <!-- Embedded YouTube Sponsored Video -->
        <div class="ad-card-item">
            <iframe width="100%" height="200" src="https://www.youtube.com/embed/tgbNymZ7vqY?autoplay=1&mute=1" style="border:none; border-radius:10px;"></iframe>
        </div>

        <!-- Provided Ad Unit 1 -->
        <div class="ad-card-item">
            <div id="container-1cec679dbd5cf50d60afe3c148706d87"></div>
        </div>

        <!-- Provided AADS Crypto Banner -->
        <div class="ad-card-item">
            <div id="frame" style="width: 100%; margin: auto; position: relative;">
                <iframe data-aa='2454008' src='//acceptable.a-ads.com/2454008/?size=Adaptive' style='border:0; padding:0; width:100%; height:auto; overflow:hidden; display: block; margin: auto;'></iframe>
            </div>
        </div>
    </div>

    <div class="toast-popup" id="customToast"></div>

    <script>
        const tg = window.Telegram?.WebApp;
        if(tg) tg.expand();

        let currentAlta = parseFloat(localStorage.getItem('alta_balance') || '54.15');
        let adStartTime = 0;

        const balanceEl = document.getElementById('altaBalance');
        balanceEl.innerText = currentAlta.toFixed(2);

        function showNotification(msg) {
            const toast = document.getElementById('customToast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3500);
        }

        function saveBalance() {
            localStorage.setItem('alta_balance', currentAlta.toString());
            balanceEl.innerText = currentAlta.toFixed(2);
        }

        // List of Ads Links for Rotating Double Ads
        const directAdsLinks = [
            "https://mammothsubway.com/rbuwwr1xk?key=f2d3ee3d88106cf8c9baceb9d7fa460a",
            "https://plump-plastic.com/b.3gVr0JP/3xpYvYbOmGVwJLZ_D/0C3nM/zvYY3sM/zzAo1/LSTdckzvNGjvc/z/M_DmkL",
            "https://adzilla.meme/bur"
        ];
        let currentAdIndex = 0;

        // Double Ads 15s Button Click Handler
        document.getElementById('doubleAdsBtn').addEventListener('click', () => {
            adStartTime = Date.now();
            
            // Pick ad URL in rotating order
            const targetUrl = directAdsLinks[currentAdIndex];
            currentAdIndex = (currentAdIndex + 1) % directAdsLinks.length;

            if (tg) {
                tg.openLink(targetUrl);
            } else {
                window.open(targetUrl, "_blank");
            }
        });

        // Track 15-second User Return Logic
        window.addEventListener('focus', () => {
            if (adStartTime > 0) {
                const elapsedSeconds = Math.floor((Date.now() - adStartTime) / 1000);
                adStartTime = 0;

                if (elapsedSeconds >= 15) {
                    currentAlta = parseFloat((currentAlta + 0.50).toFixed(2));
                    saveBalance();
                    showNotification("15 seconds completed! +0.50 ALTA added to balance.");
                } else {
                    showNotification(`You returned in ${elapsedSeconds}s. Must stay 15s to get +0.5 ALTA!`);
                }
            }
        });

        // Basic Top Video Carousel
        const topVideoList = [
            "https://www.w3schools.com/html/mov_bbb.mp4",
            "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm"
        ];
        let videoIdx = 0;
        const topVideoPlayer = document.getElementById('topBannerVideo');

        function rotateTopBannerVideo() {
            topVideoPlayer.src = topVideoList[videoIdx];
            topVideoPlayer.play().catch(()=>{});
            videoIdx = (videoIdx + 1) % topVideoList.length;
            setTimeout(rotateTopBannerVideo, 12000);
        }
        rotateTopBannerVideo();
    </script>
