<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Alta Ads Miner</title>
    <meta name="referrer" content="no-referrer-when-downgrade" />
    
    <!-- DNS & Preconnect Optimization -->
    <link rel="dns-prefetch" href="//richinfo.co">
    <link rel="dns-prefetch" href="//plump-plastic.com">
    <link rel="dns-prefetch" href="//mammothsubway.com">
    <link rel="dns-prefetch" href="//acscdn.com">

    <!-- Essential Telegram SDK Only -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Clickadu Verification -->
    <meta name="clckd" content="0cc8ffbae2313e820c2d17074f2ecc60" />

    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --primary-gold: #f39c12;
            --accent-blue: #0088cc;
            --text-color: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 12px 10px 40px 10px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        .offline-bar {
            background: #e74c3c;
            color: #fff;
            width: 100%;
            text-align: center;
            padding: 6px;
            font-size: 12px;
            font-weight: bold;
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 10000;
        }

        .ad-banner-box {
            width: 100%;
            max-width: 400px;
            min-height: 90px;
            margin-bottom: 12px;
            border-radius: 12px;
            overflow: hidden;
            background: #161b22;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            contain: content; /* Rendering Speed တိုးရန် */
        }

        .light-ad-card {
            width: 100%;
            height: 90px;
            padding: 10px 14px;
            background: linear-gradient(135deg, #1f293d 0%, #111827 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 12px;
            cursor: pointer;
        }

        .ad-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: 68%;
        }

        .ad-badge {
            background: var(--primary-gold);
            color: #000;
            font-size: 9px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            width: fit-content;
        }

        .ad-title {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ad-desc {
            font-size: 11px;
            color: #9ca3af;
        }

        .ad-action-btn {
            background: var(--accent-blue);
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            padding: 8px 10px;
            border-radius: 6px;
            text-decoration: none;
            white-space: nowrap;
        }

        .miner-card {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 18px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 15px;
            contain: content;
        }

        .title { font-size: 22px; font-weight: 800; margin-bottom: 6px; }

        .balance-display {
            font-size: 38px;
            font-weight: bold;
            color: var(--primary-gold);
            margin: 6px 0;
            text-shadow: 0 0 10px rgba(243, 156, 18, 0.35);
        }

        .status { font-size: 13px; color: #2ec4b6; margin-bottom: 14px; }

        .logo-container {
            width: 95px;
            height: 95px;
            margin: 0 auto 12px auto;
            border-radius: 50%;
            padding: 4px;
            cursor: pointer;
            box-shadow: 0 0 18px rgba(243, 156, 18, 0.5);
            will-change: transform;
        }

        .coin-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .logo-container.mining .coin-img { animation: spin-coin 1s linear infinite; }

        @keyframes spin-coin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .tap-instruction { font-size: 13px; color: #8b949e; margin-bottom: 14px; }

        .action-btn {
            width: 100%;
            padding: 13px 16px;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .action-btn:active { transform: scale(0.98); }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .btn-double { background: linear-gradient(90deg, #e67e22, #f39c12); }
        .btn-withdraw { background: linear-gradient(90deg, #27ae60, #2ecc71); }
        .btn-share { background: linear-gradient(90deg, #0088cc, #3498db); }
        .btn-high-ads { background: linear-gradient(90deg, #8e44ad, #9b59b6); }
        .btn-bonus { background: linear-gradient(90deg, #d35400, #e67e22); }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 17, 23, 0.97);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 15px;
            z-index: 1000;
        }

        .ad-modal-content {
            width: 100%;
            max-width: 360px;
            height: 180px;
            background: #161b22;
            border-radius: 14px;
            border: 1px solid #2a3547;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .btn-continue {
            width: 100%;
            max-width: 360px;
            padding: 14px;
            background: #234b6e;
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-continue.active {
            background: #0088cc;
            opacity: 1;
            cursor: pointer;
        }

        .toast-popup {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f293d;
            color: #fff;
            padding: 12px 22px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid var(--primary-gold);
            display: none;
            z-index: 9999;
            text-align: center;
            box-shadow: 0 4px 18px rgba(0,0,0,0.6);
            max-width: 85%;
        }
    </style>
</head>
<body>

    <div class="offline-bar" id="offlineBar">⚠️ Connection Lost! Mining Disabled.</div>
    <div class="toast-popup" id="customToast"></div>

    <div class="ad-banner-box" id="topAdRotateBox"></div>

    <div class="miner-card">
        <div class="title">Alta Ads Miner</div>
        <div class="balance-display" id="altaBalance">0.00</div>
        <div class="status" id="systemStatus">System: Operational</div>

        <div class="logo-container" id="tapBtn">
            <img src="alta-coin.png" alt="Alta Coin" class="coin-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/6001/6001368.png'">
        </div>

        <div class="tap-instruction" id="tapInstruction">Tap to mine Alta!</div>

        <button class="action-btn btn-double task-btn" id="doubleAdsBtn">
            <span>⚡ Double Ads 15s</span>
            <span>+0.5 ALTA</span>
        </button>

        <button class="action-btn btn-withdraw task-btn" id="openWithdrawModal">Withdraw Alta (Min: 150)</button>

        <button class="action-btn btn-share task-btn" id="shareBtn">
            <span>🚀 Share Link</span>
            <span>+5 ALTA</span>
        </button>

        <button class="action-btn btn-high-ads task-btn" id="highAdsBtn">
            <span>🚀 Daily High Ads 15s</span>
            <span id="highAdsCounter">0/100 (+1 ALTA)</span>
        </button>

        <button class="action-btn btn-bonus task-btn" id="dailyBonusBtn">
            <span>🎁 Daily Bonus 15s</span>
            <span id="bonusCounter">0/30 (+1~3 ALTA)</span>
        </button>
    </div>

    <div id="container-1cec679dbd5cf50d60afe3c148706d87" style="margin-bottom: 12px; width: 100%; max-width: 400px;"></div>

    <div class="ad-banner-box" id="bottomAdRotateBox"></div>

    <div class="modal-overlay" id="adModal">
        <div class="ad-banner-box" id="modalTopAdBox"></div>
        <div class="ad-modal-content" id="modalCenterAdBox"></div>
        <button class="btn-continue" id="continueAdBtn" disabled>Please wait 15s...</button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if(tg) { tg.expand(); tg.ready(); }

        let currentAlta = parseFloat(localStorage.getItem('alta_balance') || '0.00');
        let highAdsCount = parseInt(localStorage.getItem('high_ads_count') || '0');
        let bonusCount = parseInt(localStorage.getItem('bonus_count') || '0');
        
        let isMining = false;
        let activeTaskType = null;
        let adStartTime = 0;
        let isProcessingTask = false;

        const balanceEl = document.getElementById('altaBalance');
        const tapBtn = document.getElementById('tapBtn');
        const tapInstruction = document.getElementById('tapInstruction');
        const adModal = document.getElementById('adModal');
        const continueAdBtn = document.getElementById('continueAdBtn');
        const customToast = document.getElementById('customToast');
        const offlineBar = document.getElementById('offlineBar');

        function updateUI() {
            balanceEl.innerText = currentAlta.toFixed(2);
            document.getElementById('highAdsCounter').innerText = `${highAdsCount}/100 (+1 ALTA)`;
            document.getElementById('bonusCounter').innerText = `${bonusCount}/30 (+1~3 ALTA)`;
            localStorage.setItem('alta_balance', currentAlta.toString());
            localStorage.setItem('high_ads_count', highAdsCount.toString());
            localStorage.setItem('bonus_count', bonusCount.toString());
        }
        updateUI();

        function showNotification(msg) {
            customToast.innerText = msg;
            customToast.style.display = 'block';
            setTimeout(() => { customToast.style.display = 'none'; }, 2500);
        }

        const directLinks = [
            'https://richinfo.co/richpartners/pops/js/richads-pu-ob.js',
            'https://plump-plastic.com/PEwa43',
            'https://plump-plastic.com/b.3CV-0xPm3Lp/vNb/m/VcJAZ/Du0v3/MqzUY/3UMXzRAD1WLcTMc/zNN/jCc/zFMsDjkW',
            'https://mammothsubway.com/rj0adayj?key=b1b9b60a34e0cd221a97d742cd97b6cb'
        ];
        
        function getRandomLink() {
            return directLinks[Math.floor(Math.random() * directLinks.length)];
        }

        const lightBannerPool = [
            { title: "🎮 Play & Earn Web3 Game", desc: "Instant Rewards for Active Players!", btn: "PLAY NOW", tag: "GAME AD" },
            { title: "💰 Quick Micro Loans", desc: "Approved in 5 minutes with low rates.", btn: "APPLY NOW", tag: "LOAN AD" },
            { title: "⚡ High Return Crypto Staking", desc: "Earn up to 30% APY daily payouts.", btn: "CLAIM NOW", tag: "FINANCE" }
        ];

        function createAdHtml(item) {
            const link = getRandomLink();
            return `<div class="light-ad-card" onclick="window.open('${link}', '_blank')">
                <div class="ad-info">
                    <span class="ad-badge">${item.tag}</span>
                    <span class="ad-title">${item.title}</span>
                    <span class="ad-desc">${item.desc}</span>
                </div>
                <a href="${link}" target="_blank" class="ad-action-btn">${item.btn}</a>
            </div>`;
        }

        function rotateBannerAds() {
            const item1 = lightBannerPool[Math.floor(Math.random() * lightBannerPool.length)];
            const item2 = lightBannerPool[Math.floor(Math.random() * lightBannerPool.length)];

            document.getElementById('topAdRotateBox').innerHTML = createAdHtml(item1);
            document.getElementById('bottomAdRotateBox').innerHTML = createAdHtml(item2);

            setTimeout(rotateBannerAds, 15000); // 15s Timer ဖြင့် CPU Load လျှော့ချထားသည်
        }
        rotateBannerAds();

        tapBtn.addEventListener('click', () => {
            if (!navigator.onLine || isMining || isProcessingTask) return;

            isMining = true;
            isProcessingTask = true;
            window.open(getRandomLink(), '_blank');

            tapBtn.classList.add('mining');
            tapInstruction.innerText = "Mining Alta in progress...";

            let stepCount = 0;
            let interval = setInterval(() => {
                stepCount++;
                currentAlta = parseFloat((currentAlta + 0.05).toFixed(2));
                updateUI();

                if (stepCount >= 20) {
                    clearInterval(interval);
                    tapBtn.classList.remove('mining');
                    isMining = false;
                    isProcessingTask = false;
                    tapInstruction.innerText = "Tap to mine Alta again!";
                }
            }, 750);
        });

        /* Lazy Load External Scripts Seamlessly */
        function loadScript(src) {
            return new Promise((resolve) => {
                const s = document.createElement('script');
                s.src = src;
                s.async = true;
                s.onload = s.onerror = () => resolve();
                document.body.appendChild(s);
            });
        }

        // DOM Render ပြီးမှ အလွန်ပေါ့ပါးစွာ Background Ad Scripts များကို ခေါ်ယူပေးမည်
        window.addEventListener('load', () => {
            const deferLoad = window.requestIdleCallback || ((cb) => setTimeout(cb, 2000));
            deferLoad(async () => {
                await loadScript("https://richinfo.co/richpartners/in-page/js/richads-ob.js?pubid=1021768&siteid=406187");
                await loadScript("//acscdn.com/script/aclib.js");
                if (typeof aclib !== 'undefined') {
                    aclib.runAutoTag({ zoneId: 'jaxxc0ldkk' });
                }
                await loadScript("https://mammothsubway.com/1cec679dbd5cf50d60afe3c148706d87/invoke.js");
            });
        });
    </script>
</body>
</html>
