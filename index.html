<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Alta Ads Miner</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Optimized Ad Scripts (Lightweight loading) -->
    <script id="aclib" type="text/javascript" src="//acscdn.com/script/aclib.js" async></script>
    <script type="text/javascript">
        window.addEventListener('DOMContentLoaded', () => {
            if(window.aclib) aclib.runAutoTag({ zoneId: 'jaxxc0ldkk' });
        });
    </script>
    <meta name="referrer" content="no-referrer-when-downgrade" />

    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --primary-gold: #f39c12;
            --accent-blue: #0088cc;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 10px 0 30px 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Banner Style */
        .ad-banner-frame {
            width: 90%;
            max-width: 380px;
            min-height: 60px;
            margin-bottom: 12px;
            border-radius: 10px;
            overflow: hidden;
            background: #1f293d;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .miner-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .title { font-size: 20px; font-weight: 800; margin-bottom: 4px; }

        .balance-display {
            font-size: 34px;
            font-weight: bold;
            color: var(--primary-gold);
            margin: 4px 0;
            text-shadow: 0 0 8px rgba(243, 156, 18, 0.3);
        }

        .status { font-size: 12px; color: #2ec4b6; margin-bottom: 10px; }

        .logo-container {
            width: 100px;
            height: 100px;
            margin: 0 auto 10px auto;
            border-radius: 50%;
            padding: 4px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(243, 156, 18, 0.4);
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(0, 136, 204, 0.4); }
            50% { transform: scale(1.02); box-shadow: 0 0 20px rgba(243, 156, 18, 0.7); }
            100% { transform: scale(1); box-shadow: 0 0 10px rgba(0, 136, 204, 0.4); }
        }

        .coin-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .logo-container.mining .coin-img { animation: spin-coin 1s linear infinite; }

        @keyframes spin-coin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .tap-instruction { font-size: 12px; color: #8b949e; margin-bottom: 10px; }

        .action-btn {
            width: 100%;
            padding: 12px 14px;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .action-btn:active { transform: scale(0.98); }

        .btn-double { background: linear-gradient(90deg, #e67e22, #f39c12); }
        .btn-withdraw { background: linear-gradient(90deg, #27ae60, #2ecc71); }
        .btn-share { background: linear-gradient(90deg, #0088cc, #3498db); }
        .btn-high-ads { background: linear-gradient(90deg, #8e44ad, #9b59b6); }
        .btn-bonus { background: linear-gradient(90deg, #d35400, #e67e22); }

        .ads-feed-container {
            width: 90%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 17, 23, 0.96);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 15px;
            box-sizing: border-box;
            z-index: 1000;
        }

        .ad-modal-content {
            width: 100%;
            max-width: 340px;
            height: 220px;
            background: #161b22;
            border-radius: 12px;
            border: 1px solid #21262d;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .btn-continue {
            width: 100%;
            max-width: 340px;
            padding: 13px;
            background: #234b6e;
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-continue.active {
            background: #0088cc;
            opacity: 1;
            cursor: pointer;
        }

        /* Payout Modal Styles */
        .payout-card {
            background: #121824;
            border: 2px solid var(--primary-gold);
            border-radius: 14px;
            padding: 18px;
            width: 85%;
            max-width: 320px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #2a3547;
            background: #090d14;
            color: #fff;
            box-sizing: border-box;
            margin-bottom: 8px;
        }

        .btn-submit {
            width: 100%;
            padding: 11px;
            background: #27ae60;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 11px;
            margin-bottom: 8px;
            display: none;
            text-align: left;
        }

        .toast-popup {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f293d;
            color: #fff;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid var(--primary-gold);
            display: none;
            z-index: 9999;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 80%;
        }
    </style>
</head>
<body>

    <!-- Notification Toast -->
    <div class="toast-popup" id="customToast"></div>

    <!-- Top Display Ad Banner -->
    <div class="ad-banner-frame" id="topAdBanner">
        <!-- Responsive High CPM Display Ads Component -->
        <a href="https://mammothsubway.com/rbuwwr1xk?key=f2d3ee3d88106cf8c9baceb9d7fa460a" target="_blank" style="color:#f39c12; font-weight:bold; text-decoration:none; padding:10px;">
            ⚡ [SPONSORED] Fast Crypto Loan & Instant Rewards ->
        </a>
    </div>

    <div class="miner-card">
        <div class="title">Alta Ads Miner</div>
        <div class="balance-display" id="altaBalance">0.00</div>
        <div class="status" id="systemStatus">System: Operational</div>

        <div class="logo-container" id="tapBtn">
            <img src="alta-coin.png" alt="Alta Coin" class="coin-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/6001/6001368.png'">
        </div>

        <div class="tap-instruction" id="tapInstruction">Tap to mine Alta!</div>

        <!-- Action Buttons -->
        <button class="action-btn btn-double" id="doubleAdsBtn">
            <span>⚡ Double Ads 15s</span>
            <span>+0.5 ALTA</span>
        </button>

        <button class="action-btn btn-withdraw" id="openWithdrawModal">Withdraw Alta (Min: 150)</button>
        <button class="action-btn btn-share" id="shareBtn">
            <span>🚀 Share Link</span>
            <span>+5 ALTA</span>
        </button>

        <button class="action-btn btn-high-ads" id="highAdsBtn">
            <span>🚀 Daily High Ads 15s</span>
            <span id="highAdsCounter">0/100 (+1 ALTA)</span>
        </button>

        <button class="action-btn btn-bonus" id="dailyBonusBtn">
            <span>🎁 Daily Bonus 15s</span>
            <span id="bonusCounter">0/30 (+1~3 ALTA)</span>
        </button>
    </div>

    <div class="ads-feed-container">
        <!-- Native Ad Container -->
        <div class="ad-banner-frame">
            <script async="async" data-cfasync="false" src="https://mammothsubway.com/1cec679dbd5cf50d60afe3c148706d87/invoke.js"></script>
            <div id="container-1cec679dbd5cf50d60afe3c148706d87"></div>
        </div>

        <!-- Bottom Banner Ad -->
        <div class="ad-banner-frame">
            <a href="https://plump-plastic.com/PEwa43" target="_blank" style="color:#2ecc71; font-weight:bold; text-decoration:none; padding:10px;">
                🎮 Play Games & Win Free Crypto Bonuses Now!
            </a>
        </div>
    </div>

    <!-- 15s Video / High CPM Modal Ad -->
    <div class="modal-overlay" id="adModal">
        <div class="ad-banner-frame" id="modalTopAdBox">
            <span style="color:#0088cc; font-weight:bold;">🔥 Sponsored Ad Offer</span>
        </div>
        
        <div class="ad-modal-content" id="modalCenterAdBox">
            <iframe id="adFrame" src="https://mammothsubway.com/rbuwwr1xk?key=f2d3ee3d88106cf8c9baceb9d7fa460a" style="width:100%; height:100%; border:none;"></iframe>
        </div>

        <button class="btn-continue" id="continueAdBtn" disabled>Please wait 15s...</button>
    </div>

    <!-- Withdraw Modal (Logic Untouched) -->
    <div class="modal-overlay" id="payoutModal" style="justify-content: center;">
        <div class="payout-card">
            <h3 style="color: var(--primary-gold); margin-top:0; text-align:center;">Withdrawal Request</h3>
            
            <div class="input-group">
                <input type="text" id="username" placeholder="Telegram Username (@user)">
                <div class="error-msg" id="userError">Valid Username required!</div>
            </div>

            <div class="input-group">
                <input type="number" id="altaAmount" placeholder="Amount (Min 150 ALTA)">
            </div>

            <div class="input-group">
                <input type="text" id="tonAddress" placeholder="TON Wallet Address">
                <div class="error-msg" id="addressError">Invalid TON address! Must start with UQ or EQ.</div>
            </div>

            <button class="btn-submit" id="submitPayout">SUBMIT WITHDRAWAL</button>
            <center><button style="background:none; border:none; color:#8b949e; margin-top:10px; cursor:pointer;" id="closeModal">Cancel</button></center>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if(tg) { tg.expand(); tg.ready(); }

        const BOT_TOKEN = "8600671562:AAFYO8KewkhoCIrw_wxvfoEQvfFF4EW5iLw"; 
        const CHANNEL_ID = "@AltaHub_ads_withdraw_history";
        const MIN_WITHDRAW = 150.00;
        const KEEP_RESERVE_BALANCE = 300.00;

        let currentAlta = parseFloat(localStorage.getItem('alta_balance') || '0.00');
        let highAdsCount = parseInt(localStorage.getItem('high_ads_count') || '0');
        let bonusCount = parseInt(localStorage.getItem('bonus_count') || '0');
        let withdrawCount = parseInt(localStorage.getItem('alta_withdraw_count') || '0');
        
        let isMining = false;
        let isAdShowing = false;
        let activeTaskType = null;
        let adStartTime = 0;

        const balanceEl = document.getElementById('altaBalance');
        const tapBtn = document.getElementById('tapBtn');
        const tapInstruction = document.getElementById('tapInstruction');
        const adModal = document.getElementById('adModal');
        const continueAdBtn = document.getElementById('continueAdBtn');
        const customToast = document.getElementById('customToast');

        const highAdsCounter = document.getElementById('highAdsCounter');
        const bonusCounter = document.getElementById('bonusCounter');

        // Withdraw Elements
        const payoutModal = document.getElementById('payoutModal');
        const openWithdrawModalBtn = document.getElementById('openWithdrawModal');
        const closeModalBtn = document.getElementById('closeModal');
        const submitPayoutBtn = document.getElementById('submitPayout');
        const usernameInput = document.getElementById('username');
        const altaAmountInput = document.getElementById('altaAmount');
        const tonAddressInput = document.getElementById('tonAddress');
        const addressError = document.getElementById('addressError');
        const userError = document.getElementById('userError');

        if (tg && tg.initDataUnsafe?.user?.username) {
            usernameInput.value = "@" + tg.initDataUnsafe.user.username;
        }

        function updateUI() {
            balanceEl.innerText = currentAlta.toFixed(2);
            highAdsCounter.innerText = `${highAdsCount}/100 (+1 ALTA)`;
            bonusCounter.innerText = `${bonusCount}/30 (+1~3 ALTA)`;
            localStorage.setItem('alta_balance', currentAlta.toString());
            localStorage.setItem('high_ads_count', highAdsCount.toString());
            localStorage.setItem('bonus_count', bonusCount.toString());
            localStorage.setItem('alta_withdraw_count', withdrawCount.toString());
        }
        updateUI();

        function showNotification(msg) {
            customToast.innerText = msg;
            customToast.style.display = 'block';
            setTimeout(() => { customToast.style.display = 'none'; }, 3000);
        }

        const directLinks = [
            'https://mammothsubway.com/rbuwwr1xk?key=f2d3ee3d88106cf8c9baceb9d7fa460a',
            'https://plump-plastic.com/PEwa43'
        ];
        function getRandomLink() {
            return directLinks[Math.floor(Math.random() * directLinks.length)];
        }

        /* 1. Mining Flow */
        tapBtn.addEventListener('click', () => {
            if (isMining || isAdShowing) return;

            window.open(getRandomLink(), '_blank');

            isMining = true;
            tapBtn.classList.add('mining');
            tapInstruction.innerText = "Mining Alta in progress...";

            let stepCount = 0;
            let interval = setInterval(() => {
                stepCount++;
                currentAlta = parseFloat((currentAlta + 0.05).toFixed(2));
                updateUI();

                if (stepCount >= 20) { // 15 Seconds
                    clearInterval(interval);
                    tapBtn.classList.remove('mining');
                    isMining = false;

                    trigger15SecModalAd(() => {
                        tapInstruction.innerText = "Tap to mine Alta again!";
                    });
                }
            }, 750);
        });

        /* 2. Video Modal Ad Flow */
        function trigger15SecModalAd(onComplete) {
            isAdShowing = true;
            adModal.style.display = 'flex';
            continueAdBtn.disabled = true;
            continueAdBtn.classList.remove('active');
            continueAdBtn.innerText = "Please wait 15s...";

            let timeLeft = 15;
            let adInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(adInterval);
                    continueAdBtn.disabled = false;
                    continueAdBtn.classList.add('active');
                    continueAdBtn.innerText = "Continue Mining";
                } else {
                    continueAdBtn.innerText = `Please wait ${timeLeft}s...`;
                }
            }, 1000);

            continueAdBtn.onclick = () => {
                if (!continueAdBtn.disabled) {
                    adModal.style.display = 'none';
                    isAdShowing = false;
                    showNotification("Mining Completed! Reward added!");
                    if(onComplete) onComplete();
                }
            };
        }

        /* 3. High CPM Direct Task Flow */
        function startDirectTask(type) {
            activeTaskType = type;
            adStartTime = Date.now();
            window.open(getRandomLink(), "_blank");
        }

        document.getElementById('doubleAdsBtn').addEventListener('click', () => startDirectTask('double'));

        document.getElementById('highAdsBtn').addEventListener('click', () => {
            if (highAdsCount >= 100) return showNotification("Daily High Ads limit reached!");
            startDirectTask('high');
        });

        document.getElementById('dailyBonusBtn').addEventListener('click', () => {
            if (bonusCount >= 30) return showNotification("Daily Bonus limit reached!");
            startDirectTask('bonus');
        });

        window.addEventListener('focus', () => {
            if (adStartTime > 0 && activeTaskType) {
                const elapsed = Math.floor((Date.now() - adStartTime) / 1000);
                adStartTime = 0;

                if (elapsed >= 15) {
                    if (activeTaskType === 'double') {
                        currentAlta += 0.50;
                        showNotification("✅ Verified! +0.50 ALTA Added!");
                    } else if (activeTaskType === 'high') {
                        highAdsCount++;
                        currentAlta += 1.00;
                        showNotification(`✅ High Ad Verified! +1.00 ALTA`);
                    } else if (activeTaskType === 'bonus') {
                        bonusCount++;
                        const bonus = Math.floor(Math.random() * 3) + 1;
                        currentAlta += bonus;
                        showNotification(`🎁 Bonus Verified! +${bonus} ALTA`);
                    }
                    updateUI();
                } else {
                    showNotification(`❌ View full 15s! (${elapsed}s elapsed)`);
                }
                activeTaskType = null;
            }
        });

        /* Share Button Fix */
        document.getElementById('shareBtn').addEventListener('click', () => {
            let userId = tg?.initDataUnsafe?.user?.id || "user";
            let botUsername = "AltaHub_ads_bot";
            let refLink = `https://t.me/${botUsername}?start=${userId}`;
            let shareText = "Join Alta Ads Miner & claim +5 ALTA bonus!";
            
            if (tg) {
                tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=${encodeURIComponent(shareText)}`);
            } else {
                navigator.clipboard.writeText(refLink);
                showNotification("Link copied to clipboard!");
            }
        });

        /* Withdraw Logic */
        openWithdrawModalBtn.addEventListener('click', () => {
            if (withdrawCount === 0) {
                if (currentAlta < MIN_WITHDRAW) {
                    return showNotification(`Min withdraw is ${MIN_WITHDRAW} ALTA!`);
                }
                altaAmountInput.value = currentAlta.toFixed(2);
            } else {
                const maxAvailable = currentAlta - KEEP_RESERVE_BALANCE;
                if (maxAvailable < MIN_WITHDRAW) {
                    return showNotification(`2nd+ withdraw requires 300 ALTA reserve.`);
                }
                altaAmountInput.value = maxAvailable.toFixed(2);
            }

            addressError.style.display = 'none';
            userError.style.display = 'none';
            payoutModal.style.display = 'flex';
        });

        closeModalBtn.addEventListener('click', () => payoutModal.style.display = 'none');

        submitPayoutBtn.addEventListener('click', async () => {
            const address = tonAddressInput.value.trim();
            const username = usernameInput.value.trim();
            const withdrawAmount = parseFloat(altaAmountInput.value);

            const tonRegex = /^(UQ|EQ)[a-zA-Z0-9_-]{46}$/;
            const userRegex = /^@[a-zA-Z0-9_]{3,32}$/;

            let isValid = true;

            if (!userRegex.test(username)) {
                userError.style.display = 'block';
                isValid = false;
            } else { userError.style.display = 'none'; }

            if (!tonRegex.test(address)) {
                addressError.style.display = 'block';
                isValid = false;
            } else { addressError.style.display = 'none'; }

            if (isNaN(withdrawAmount) || withdrawAmount < MIN_WITHDRAW) {
                showNotification(`Minimum withdrawal is ${MIN_WITHDRAW} ALTA.`);
                return;
            }

            if (!isValid) return;

            currentAlta = parseFloat((currentAlta - withdrawAmount).toFixed(2));
            withdrawCount += 1;
            updateUI();

            const message = `<b>New Payout Request</b>\n\n` +
                            `<b>User:</b> ${username}\n` +
                            `<b>Withdraw Count:</b> ${withdrawCount}\n` +
                            `<b>Amount:</b> ${withdrawAmount.toFixed(2)} ALTA\n` +
                            `<b>TON Address:</b> <code>${address}</code>`;

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHANNEL_ID, text: message, parse_mode: 'HTML' })
                });
            } catch (err) {}

            showNotification(`Submitted: ${withdrawAmount.toFixed(2)} ALTA.`);
            payoutModal.style.display = 'none';

            if (tg) tg.openTelegramLink("https://t.me/AltaHub_ads_withdraw_history");
        });
    </script>
</body>
</html>
