<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Alta Ads Miner</title>

    <meta name="referrer" content="no-referrer-when-downgrade" />
    <meta name="010484d106a97be83fb5ed49c0487964d30d31c8" content="010484d106a97be83fb5ed49c0487964d30d31c8" />

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Essential Ad Network Scripts -->
    <script async="async" data-cfasync="false" src="https://mammothsubway.com/1cec679dbd5cf50d60afe3c148706d87/invoke.js"></script>
    <script src="https://mammothsubway.com/34/ba/b0/34bab0bd185bc292ab8ee57be14abb62.js"></script>

    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --primary-gold: #f39c12;
            --accent-blue: #0088cc;
            --btn-green: #2fa65a;
            --text-color: #ffffff;
            --danger-red: #e74c3c;
        }

        body {
            margin: 0;
            padding: 15px 0 40px 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Fixed Working Top Banner Container */
        .top-ad-banner-box {
            width: 90%;
            max-width: 380px;
            min-height: 70px;
            margin-bottom: 15px;
            border-radius: 12px;
            overflow: hidden;
            background: #1f293d;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .miner-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            width: 85%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            margin-bottom: 20px;
        }

        .title { font-size: 22px; font-weight: 800; margin-bottom: 5px; }

        .balance-display {
            font-size: 38px;
            font-weight: bold;
            color: var(--primary-gold);
            margin: 5px 0;
            text-shadow: 0 0 10px rgba(243, 156, 18, 0.3);
        }

        .status { font-size: 13px; color: #2ec4b6; margin-bottom: 12px; }

        .logo-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 12px auto;
            border-radius: 50%;
            padding: 5px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 0 20px rgba(243, 156, 18, 0.4);
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 15px rgba(0, 136, 204, 0.4); transform: scale(1); }
            50% { box-shadow: 0 0 30px rgba(243, 156, 18, 0.8); transform: scale(1.03); }
            100% { box-shadow: 0 0 15px rgba(0, 136, 204, 0.4); transform: scale(1); }
        }

        .coin-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .logo-container.mining .coin-img { animation: spin-coin 1s linear infinite; }

        @keyframes spin-coin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .tap-instruction { font-size: 13px; color: #8b949e; margin-bottom: 12px; }

        .btn-double-ad-main {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #e67e22, #f39c12);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            box-shadow: 0 4px 12px rgba(243, 156, 18, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-double-ad-main:active { transform: scale(0.98); }

        .btn-withdraw, .btn-share {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .btn-withdraw { background: linear-gradient(90deg, #27ae60, #2ecc71); }
        .btn-share { background: linear-gradient(90deg, #0088cc, #3498db); }

        .ads-feed-container {
            width: 85%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .ad-card-item {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            position: relative;
            min-height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ad-card-item iframe {
            width: 100%;
            height: 220px;
            border: none;
            background: #000;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 17, 23, 0.96);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 15px;
            box-sizing: border-box;
            z-index: 1000;
        }

        .modal-top-banner {
            width: 100%;
            max-width: 340px;
            min-height: 70px;
            background: #161b22;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2a3547;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ad-modal-content {
            width: 100%;
            max-width: 340px;
            height: 220px;
            background: #161b22;
            border-radius: 16px;
            padding: 0;
            box-sizing: border-box;
            text-align: center;
            border: 1px solid #21262d;
            margin: auto 0;
            overflow: hidden;
        }

        .btn-continue {
            width: 100%;
            max-width: 340px;
            padding: 14px;
            background: #234b6e;
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-continue.active {
            background: #0088cc;
            opacity: 1;
            cursor: pointer;
        }

        .payout-card {
            background: #121824;
            border: 2px solid var(--primary-gold);
            border-radius: 16px;
            padding: 20px;
            width: 85%;
            max-width: 320px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #2a3547;
            background: #090d14;
            color: #fff;
            box-sizing: border-box;
            margin-bottom: 8px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #27ae60;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .toast-popup {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f293d;
            color: #fff;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid var(--primary-gold);
            display: none;
            z-index: 2000;
            text-align: center;
            max-width: 85%;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 11px;
            margin-bottom: 8px;
            display: none;
            text-align: left;
        }
    </style>
</head>
<body>

    <!-- Main Top Working Banner Ads -->
    <div class="top-ad-banner-box">
        <script type="text/javascript">
            atOptions = {
                'key' : 'f2d3ee3d88106cf8c9baceb9d7fa460a',
                'format' : 'iframe',
                'height' : 60,
                'width' : 468,
                'params' : {}
            };
        </script>
        <script type="text/javascript" src="//plump-plastic.com/f2d3ee3d88106cf8c9baceb9d7fa460a/invoke.js"></script>
    </div>

    <div class="miner-card">
        <div class="title">Alta Ads Miner</div>
        <div class="balance-display" id="altaBalance">0.00</div>
        <div class="status" id="systemStatus">System: Operational</div>

        <div class="logo-container" id="tapBtn">
            <img src="alta-coin.png" alt="Alta Coin" class="coin-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/6001/6001368.png'">
        </div>

        <div class="tap-instruction" id="tapInstruction">Tap to mine Alta again!</div>

        <button class="btn-double-ad-main" id="doubleAdsBtn">
            <span>⚡ Double Ads 15s (+0.5 ALTA)</span>
        </button>

        <button class="btn-withdraw" id="openWithdrawModal">Withdraw Alta (Min: 150 ALTA)</button>
        <button class="btn-share" id="shareBtn">Invite Friend (+5 ALTA Each)</button>
    </div>

    <div class="ads-feed-container" id="adsFeedContainer">
        <!-- Sponsored Video Feed -->
        <div class="ad-card-item">
            <iframe id="videoFeedFrame" src="https://www.youtube.com/embed/tgbNymZ7vqY?autoplay=1&mute=1&enablejsapi=1" allow="autoplay; encrypted-media"></iframe>
        </div>

        <!-- Native Ad Container -->
        <div class="ad-card-item">
            <div id="container-1cec679dbd5cf50d60afe3c148706d87"></div>
        </div>

        <!-- Bottom A-ADS Adaptive Banner Unit -->
        <div class="ad-card-item" style="padding: 10px 0;">
            <iframe data-aa='2454008' src='//acceptable.a-ads.com/2454008/?size=Adaptive' style='border:0; padding:0; width:100%; height:120px; overflow:hidden; display:block; margin:auto;'></iframe>
        </div>
    </div>

    <!-- 15s Video Modal with Top Banner -->
    <div class="modal-overlay" id="adModal">
        <div class="modal-top-banner">
            <iframe data-aa='2454008' src='//acceptable.a-ads.com/2454008/?size=468x60' style='border:0; padding:0; width:100%; height:60px; overflow:hidden; display:block; margin:auto;'></iframe>
        </div>
        <div class="ad-modal-content">
            <video id="modalVideoPlayer" width="100%" height="100%" autoplay muted loop playsinline></video>
        </div>
        <button class="btn-continue" id="continueAdBtn" disabled>Please wait 15s...</button>
    </div>

    <div class="modal-overlay" id="payoutModal" style="justify-content: center;">
        <div class="payout-card">
            <h3 style="color: var(--primary-gold); margin-top:0; text-align:center;">Withdrawal Request</h3>
            
            <div class="input-group">
                <input type="text" id="username" placeholder="Telegram Username (@user)">
                <div class="error-msg" id="userError">Valid Username required!</div>
            </div>

            <div class="input-group">
                <input type="number" id="altaAmount" placeholder="Amount (Min 150 ALTA)">
            </div>

            <div class="input-group">
                <input type="text" id="tonAddress" placeholder="TON Wallet Address">
                <div class="error-msg" id="addressError">Invalid TON address! Must start with UQ or EQ.</div>
            </div>

            <button class="btn-submit" id="submitPayout">SUBMIT WITHDRAWAL</button>
            <center><button style="background:none; border:none; color:#8b949e; margin-top:10px; cursor:pointer;" id="closeModal">Cancel</button></center>
        </div>
    </div>

    <div class="toast-popup" id="customToast"></div>

    <script>
        const tg = window.Telegram?.WebApp;
        if(tg) tg.expand();

        const BOT_TOKEN = "8600671562:AAFYO8KewkhoCIrw_wxvfoEQvfFF4EW5iLw"; 
        const CHANNEL_ID = "@AltaHub_ads_withdraw_history";
        
        const MIN_WITHDRAW = 150.00;
        const KEEP_RESERVE_BALANCE = 300.00;

        let currentAlta = parseFloat(localStorage.getItem('alta_balance') || '0.00');
        let withdrawCount = parseInt(localStorage.getItem('alta_withdraw_count') || '0');
        
        let isMining = false;
        let isAdShowing = false;
        let lastTapTime = 0;
        let adStartTime = 0;

        const balanceEl = document.getElementById('altaBalance');
        balanceEl.innerText = currentAlta.toFixed(2);

        const tapBtn = document.getElementById('tapBtn');
        const tapInstruction = document.getElementById('tapInstruction');
        const systemStatus = document.getElementById('systemStatus');
        const payoutModal = document.getElementById('payoutModal');
        const adModal = document.getElementById('adModal');
        const continueAdBtn = document.getElementById('continueAdBtn');

        const openWithdrawModalBtn = document.getElementById('openWithdrawModal');
        const closeModalBtn = document.getElementById('closeModal');
        const submitPayoutBtn = document.getElementById('submitPayout');
        const shareBtn = document.getElementById('shareBtn');
        const doubleAdsBtn = document.getElementById('doubleAdsBtn');
        
        const usernameInput = document.getElementById('username');
        const altaAmountInput = document.getElementById('altaAmount');
        const tonAddressInput = document.getElementById('tonAddress');
        const addressError = document.getElementById('addressError');
        const userError = document.getElementById('userError');
        const customToast = document.getElementById('customToast');

        if (tg && tg.initDataUnsafe?.user?.username) {
            usernameInput.value = "@" + tg.initDataUnsafe.user.username;
        }

        function showNotification(msg) {
            customToast.innerText = msg;
            customToast.style.display = 'block';
            setTimeout(() => { customToast.style.display = 'none'; }, 3500);
        }

        function saveBalance() {
            localStorage.setItem('alta_balance', currentAlta.toString());
            localStorage.setItem('alta_withdraw_count', withdrawCount.toString());
            balanceEl.innerText = currentAlta.toFixed(2);
        }

        function checkNetworkConnection() {
            if (!navigator.onLine) {
                showNotification("No Internet connection! Operations halted.");
                systemStatus.innerText = "Status: Offline";
                systemStatus.style.color = "#e74c3c";
                return false;
            }
            systemStatus.innerText = "System: Operational";
            systemStatus.style.color = "#2ec4b6";
            return true;
        }

        window.addEventListener('offline', checkNetworkConnection);
        window.addEventListener('online', checkNetworkConnection);

        const directLinkPool = [
            'https://mammothsubway.com/rbuwwr1xk?key=f2d3ee3d88106cf8c9baceb9d7fa460a',
            'https://plump-plastic.com/PEwa43',
            'https://plump-plastic.com/b.3gVr0JP/3xpYvYbOmGVwJLZ_D/0C3nM/zvYY3sM/zzAo1/LSTdckzvNGjvc/z/M_DmkL'
        ];

        let directLinkIdx = 0;
        function getNextDirectLink() {
            const url = directLinkPool[directLinkIdx];
            directLinkIdx = (directLinkIdx + 1) % directLinkPool.length;
            return url;
        }

        const videoList = [
            "https://www.w3schools.com/html/mov_bbb.mp4",
            "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm",
            "https://www.w3schools.com/html/movie.mp4"
        ];

        // Alta Mining Click Event (Opens Direct Income Link & Starts 10s Spin)
        tapBtn.addEventListener('click', (e) => {
            if (!checkNetworkConnection()) return;

            const currentTime = new Date().getTime();
            if ((currentTime - lastTapTime < 350) || !e.isTrusted) {
                showNotification("Auto-Clicker detected! Ignored.");
                return;
            }
            lastTapTime = currentTime;

            if (isMining || isAdShowing) return;

            // Direct link launch for income generation
            window.open(getNextDirectLink(), '_blank');

            isMining = true;
            tapBtn.classList.add('mining');
            tapInstruction.innerText = "Mining Alta in progress (10s)...";

            let targetAlta = currentAlta + 1.00;
            let totalSteps = 20;
            let stepInterval = 500;
            let stepCount = 0;

            let interval = setInterval(() => {
                if (!checkNetworkConnection()) {
                    clearInterval(interval);
                    tapBtn.classList.remove('mining');
                    isMining = false;
                    return;
                }

                stepCount++;
                currentAlta = parseFloat((currentAlta + 0.05).toFixed(2));
                saveBalance();

                if (stepCount >= totalSteps) {
                    clearInterval(interval);
                    currentAlta = parseFloat(targetAlta.toFixed(2));
                    saveBalance();
                    tapBtn.classList.remove('mining');
                    isMining = false;

                    trigger15SecModalAd(() => {
                        tapInstruction.innerText = "Tap to mine Alta again!";
                    });
                }
            }, stepInterval);
        });

        // 15 Seconds Modal Ad logic
        function trigger15SecModalAd(onComplete) {
            isAdShowing = true;
            adModal.style.display = 'flex';
            continueAdBtn.disabled = true;
            continueAdBtn.classList.remove('active');
            continueAdBtn.innerText = "Please wait 15s...";

            const modalPlayer = document.getElementById('modalVideoPlayer');
            modalPlayer.src = videoList[Math.floor(Math.random() * videoList.length)];
            modalPlayer.play().catch(()=>{});

            let timeLeft = 15;
            let adInterval = setInterval(() => {
                if (!checkNetworkConnection()) {
                    clearInterval(adInterval);
                    adModal.style.display = 'none';
                    isAdShowing = false;
                    return;
                }

                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(adInterval);
                    continueAdBtn.disabled = false;
                    continueAdBtn.classList.add('active');
                    continueAdBtn.innerText = "Continue Mining";
                } else {
                    continueAdBtn.innerText = `Please wait ${timeLeft}s...`;
                }
            }, 1000);

            continueAdBtn.onclick = () => {
                if (!continueAdBtn.disabled && checkNetworkConnection()) {
                    adModal.style.display = 'none';
                    isAdShowing = false;
                    onComplete();
                }
            };
        }

        // Double Ads 15s Button
        doubleAdsBtn.addEventListener('click', () => {
            if (!checkNetworkConnection()) return;

            adStartTime = Date.now();
            window.open(getNextDirectLink(), "_blank");
        });

        window.addEventListener('focus', () => {
            if (adStartTime > 0) {
                const elapsedSeconds = Math.floor((Date.now() - adStartTime) / 1000);
                adStartTime = 0;

                if (elapsedSeconds >= 15) {
                    currentAlta = parseFloat((currentAlta + 0.50).toFixed(2));
                    saveBalance();
                    showNotification("15s Verified! +0.50 ALTA added to balance!");
                } else {
                    showNotification(`Viewed for ${elapsedSeconds}s only! Must stay full 15s for +0.5 ALTA.`);
                }
            }
        });

        shareBtn.addEventListener('click', () => {
            if (!checkNetworkConnection()) return;
            let userId = tg?.initDataUnsafe?.user?.id || "user";
            let botUsername = "AltaHub_ads_bot";
            let refLink = `https://t.me/${botUsername}?start=${userId}`;
            
            if (tg) {
                tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=${encodeURIComponent("Join Alta Ads Miner & claim +5 ALTA bonus!")}`);
            } else {
                navigator.clipboard.writeText(refLink);
                showNotification("Referral link copied!");
            }
        });

        openWithdrawModalBtn.addEventListener('click', () => {
            if (!checkNetworkConnection()) return;

            if (withdrawCount === 0) {
                if (currentAlta < MIN_WITHDRAW) {
                    showNotification(`First withdrawal requires minimum ${MIN_WITHDRAW} ALTA!`);
                    return;
                }
                altaAmountInput.value = currentAlta.toFixed(2);
            } else {
                const maxAvailable = currentAlta - KEEP_RESERVE_BALANCE;
                if (maxAvailable < MIN_WITHDRAW) {
                    showNotification(`2nd+ withdrawal requires 300 ALTA reserve.`);
                    return;
                }
                altaAmountInput.value = maxAvailable.toFixed(2);
            }

            addressError.style.display = 'none';
            userError.style.display = 'none';
            payoutModal.style.display = 'flex';
        });

        closeModalBtn.addEventListener('click', () => {
            payoutModal.style.display = 'none';
        });

        submitPayoutBtn.addEventListener('click', async () => {
            if (!checkNetworkConnection()) return;

            const address = tonAddressInput.value.trim();
            const username = usernameInput.value.trim();
            const withdrawAmount = parseFloat(altaAmountInput.value);

            const tonRegex = /^(UQ|EQ)[a-zA-Z0-9_-]{46}$/;
            const userRegex = /^@[a-zA-Z0-9_]{3,32}$/;

            let isValid = true;

            if (!userRegex.test(username)) {
                userError.style.display = 'block';
                isValid = false;
            } else {
                userError.style.display = 'none';
            }

            if (!tonRegex.test(address)) {
                addressError.style.display = 'block';
                isValid = false;
            } else {
                addressError.style.display = 'none';
            }

            if (isNaN(withdrawAmount) || withdrawAmount < MIN_WITHDRAW) {
                showNotification(`Minimum withdrawal amount is ${MIN_WITHDRAW} ALTA.`);
                return;
            }

            if (!isValid) return;

            currentAlta = parseFloat((currentAlta - withdrawAmount).toFixed(2));
            withdrawCount += 1;
            saveBalance();

            const message = `<b>New Payout Request</b>\n\n` +
                            `<b>User:</b> ${username}\n` +
                            `<b>Withdraw Count:</b> ${withdrawCount}\n` +
                            `<b>Amount:</b> ${withdrawAmount.toFixed(2)} ALTA\n` +
                            `<b>Remaining Balance:</b> ${currentAlta.toFixed(2)} ALTA\n` +
                            `<b>TON Address:</b> <code>${address}</code>`;

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHANNEL_ID, text: message, parse_mode: 'HTML' })
                });
            } catch (err) { console.error(err); }

            showNotification(`Withdrawal request submitted: ${withdrawAmount.toFixed(2)} ALTA.`);
            payoutModal.style.display = 'none';

            if (tg) tg.openTelegramLink("https://t.me/AltaHub_ads_withdraw_history");
            else window.open("https://t.me/AltaHub_ads_withdraw_history", "_blank");
        });
    </script>
</body>
</html>
