    <script>
        const tg = window.Telegram?.WebApp;
        if(tg) { tg.expand(); tg.ready(); }

        const BOT_TOKEN = "8600671562:AAFYO8KewkhoCIrw_wxvfoEQvfFF4EW5iLw"; 
        const CHANNEL_ID = "@AltaHub_ads_withdraw_history";
        const MIN_WITHDRAW = 150.00;
        const KEEP_RESERVE_BALANCE = 300.00;

        let currentAlta = parseFloat(localStorage.getItem('alta_balance') || '0.00');
        let highAdsCount = parseInt(localStorage.getItem('high_ads_count') || '0');
        let bonusCount = parseInt(localStorage.getItem('bonus_count') || '0');
        let withdrawCount = parseInt(localStorage.getItem('alta_withdraw_count') || '0');
        
        // Strict 24-Hour Reset Timer Logic (Resets counts to 0 exactly after 24 hrs)
        let lastResetTime = parseInt(localStorage.getItem('last_daily_reset') || '0');
        const NOW = Date.now();
        const TWENTY_FOUR_HOURS = 24 * 60 * 60 * 1000;

        if (!lastResetTime) {
            localStorage.setItem('last_daily_reset', NOW.toString());
        } else if (NOW - lastResetTime >= TWENTY_FOUR_HOURS) {
            highAdsCount = 0;
            bonusCount = 0;
            localStorage.setItem('high_ads_count', '0');
            localStorage.setItem('bonus_count', '0');
            localStorage.setItem('last_daily_reset', NOW.toString());
        }

        let isMining = false;
        let isAdShowing = false;
        let activeTaskType = null;
        let adStartTime = 0;

        const balanceEl = document.getElementById('altaBalance');
        const tapBtn = document.getElementById('tapBtn');
        const tapInstruction = document.getElementById('tapInstruction');
        const adModal = document.getElementById('adModal');
        const continueAdBtn = document.getElementById('continueAdBtn');
        const customToast = document.getElementById('customToast');
        const offlineBar = document.getElementById('offlineBar');

        const highAdsCounter = document.getElementById('highAdsCounter');
        const bonusCounter = document.getElementById('bonusCounter');

        const payoutModal = document.getElementById('payoutModal');
        const openWithdrawModalBtn = document.getElementById('openWithdrawModal');
        const closeModalBtn = document.getElementById('closeModal');
        const submitPayoutBtn = document.getElementById('submitPayout');
        const usernameInput = document.getElementById('username');
        const altaAmountInput = document.getElementById('altaAmount');
        const tonAddressInput = document.getElementById('tonAddress');

        if (tg && tg.initDataUnsafe?.user?.username) {
            usernameInput.value = "@" + tg.initDataUnsafe.user.username;
        }

        function checkNetworkStatus() {
            offlineBar.style.display = navigator.onLine ? 'none' : 'block';
        }
        window.addEventListener('online', checkNetworkStatus);
        window.addEventListener('offline', checkNetworkStatus);

        function updateUI() {
            balanceEl.innerText = currentAlta.toFixed(2);
            highAdsCounter.innerText = `${highAdsCount}/100 (+1 ALTA)`;
            bonusCounter.innerText = `${bonusCount}/30 (+1~3 ALTA)`;
            localStorage.setItem('alta_balance', currentAlta.toString());
            localStorage.setItem('high_ads_count', highAdsCount.toString());
            localStorage.setItem('bonus_count', bonusCount.toString());
            localStorage.setItem('alta_withdraw_count', withdrawCount.toString());
        }
        updateUI();
        checkNetworkStatus();

        function showNotification(msg) {
            customToast.innerText = msg;
            customToast.style.display = 'block';
            setTimeout(() => { customToast.style.display = 'none'; }, 2500);
        }

        // Ordered Direct Links Pool (Priority 1: RichAds, Priority 2: Adsterra, Priority 3: HilltopAds)
        const directLinks = [
            'https://richinfo.co/richpartners/my-miner-app-8282.vercel.app/',
            'https://mammothsubway.com/rbuwwr1xk?key=f2d3ee3d88106cf8c9baceb9d7fa460a',
            'https://plump-plastic.com/PEwa43',
            'https://plump-plastic.com/bh3cV.0dPd3tpzv/bYmqV/JbZuD-0i3/MUzCY/3SMBzbAS1rLwTvczz/N/jcctzXMrDikp'
        ];
        
        function getRandomLink() {
            return directLinks[Math.floor(Math.random() * directLinks.length)];
        }

        // High CTR Local Custom Native Banner Pool (KBZ, Wave Pay, FB, Crypto, Loan)
        const lightBannerPool = [
            { title: "KBZPay Special Cashback Bonus", desc: "Claim instant transaction rewards now", btn: "CLAIM KPAY", tag: "PAYMENT" },
            { title: "Wave Pay Cash Reward Offer", desc: "Get free transaction bonus instantly", btn: "GET WAVE", tag: "WAVE PAY" },
            { title: "FB Account Security & Recovery", desc: "Protect and secure your FB account", btn: "CHECK NOW", tag: "SECURITY" },
            { title: "Instant Personal Micro Loan", desc: "Low interest rate & immediate payout", btn: "APPLY NOW", tag: "LOAN AD" },
            { title: "Web3 Crypto Mining Platform", desc: "Earn up to 35% APY with daily payouts", btn: "EARN NOW", tag: "CRYPTO" }
        ];

        function createAdHtml(item) {
            const link = getRandomLink();
            return `<div class="light-ad-card" onclick="window.open('${link}', '_blank')">
                <div class="ad-info">
                    <span class="ad-badge">${item.tag}</span>
                    <span class="ad-title">${item.title}</span>
                    <span class="ad-desc">${item.desc}</span>
                </div>
                <a href="${link}" target="_blank" class="ad-action-btn">${item.btn}</a>
            </div>`;
        }

        // Auto-rotate Banners every 8-12 seconds
        function rotateBannerAds() {
            const topBox = document.getElementById('topAdRotateBox');
            const modalTopBox = document.getElementById('modalTopAdBox');
            const modalCenterBox = document.getElementById('modalCenterAdBox');

            const item = lightBannerPool[Math.floor(Math.random() * lightBannerPool.length)];

            if (topBox && Math.random() > 0.5) topBox.innerHTML = createAdHtml(item);
            if (modalTopBox) modalTopBox.innerHTML = createAdHtml(item);
            if (modalCenterBox && isAdShowing) modalCenterBox.innerHTML = createAdHtml(item);

            const randomInterval = Math.floor(Math.random() * 4000) + 8000; // 8s to 12s
            setTimeout(rotateBannerAds, randomInterval);
        }
        rotateBannerAds();

        // Tap Mining Logic
        tapBtn.addEventListener('click', () => {
            if (!navigator.onLine || isMining) return;

            isMining = true;
            window.open(getRandomLink(), '_blank');

            tapBtn.classList.add('mining');
            tapInstruction.innerText = "Mining Alta in progress...";

            let stepCount = 0;
            let interval = setInterval(() => {
                stepCount++;
                currentAlta = parseFloat((currentAlta + 0.05).toFixed(2));
                updateUI();

                if (stepCount >= 20) {
                    clearInterval(interval);
                    tapBtn.classList.remove('mining');
                    isMining = false;

                    trigger15SecModalAd(() => {
                        tapInstruction.innerText = "Tap to mine Alta again!";
                    });
                }
            }, 750);
        });

        // Mandatory 15 Seconds Modal Ad Logic
        function trigger15SecModalAd(onComplete) {
            isAdShowing = true;
            const modalCenterBox = document.getElementById('modalCenterAdBox');
            modalCenterBox.innerHTML = createAdHtml(lightBannerPool[Math.floor(Math.random() * lightBannerPool.length)]);

            adModal.style.display = 'flex';
            continueAdBtn.disabled = true;
            continueAdBtn.classList.remove('active');
            continueAdBtn.innerText = "Please wait 15s...";

            let timeLeft = 15;
            let adInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(adInterval);
                    continueAdBtn.disabled = false;
                    continueAdBtn.classList.add('active');
                    continueAdBtn.innerText = "Continue Mining Alta";
                } else {
                    continueAdBtn.innerText = `Please wait ${timeLeft}s...`;
                }
            }, 1000);

            continueAdBtn.onclick = () => {
                if (!continueAdBtn.disabled) {
                    window.open(getRandomLink(), '_blank');
                    adModal.style.display = 'none';
                    isAdShowing = false;
                    showNotification("Reward Claimed Successfully!");
                    if(onComplete) onComplete();
                }
            };
        }

        // Direct Task Triggering Logic
        function startDirectTask(type) {
            if (!navigator.onLine) return;

            activeTaskType = type;
            adStartTime = Date.now();
            window.open(getRandomLink(), "_blank");
        }

        document.getElementById('doubleAdsBtn').addEventListener('click', () => startDirectTask('double'));

        document.getElementById('highAdsBtn').addEventListener('click', () => {
            if (highAdsCount >= 100) {
                showNotification("Daily High Ads limit reached (100/100)!");
                return;
            }
            startDirectTask('high');
        });

        document.getElementById('dailyBonusBtn').addEventListener('click', () => {
            if (bonusCount >= 30) {
                showNotification("Daily Bonus limit reached (30/30)!");
                return;
            }
            startDirectTask('bonus');
        });

        // Focus & Time Verification System
        window.addEventListener('focus', () => {
            if (adStartTime > 0 && activeTaskType) {
                const elapsed = Math.floor((Date.now() - adStartTime) / 1000);
                adStartTime = 0;

                if (elapsed >= 15) {
                    if (activeTaskType === 'double') {
                        currentAlta = parseFloat((currentAlta + 0.50).toFixed(2));
                        showNotification("15s Completed! +0.50 ALTA Added!");
                    } else if (activeTaskType === 'high') {
                        highAdsCount++;
                        currentAlta = parseFloat((currentAlta + 1.00).toFixed(2));
                        showNotification(`15s Completed! +1.00 ALTA Added (${highAdsCount}/100)`);
                    } else if (activeTaskType === 'bonus') {
                        bonusCount++;
                        const bonus = Math.floor(Math.random() * 3) + 1;
                        currentAlta = parseFloat((currentAlta + bonus).toFixed(2));
                        showNotification(`15s Completed! +${bonus}.00 ALTA Bonus Added (${bonusCount}/30)`);
                    }
                    updateUI();
                } else {
                    showNotification(`15s Not Completed! (${elapsed}s/15s) Please view for 15s.`);
                }
                
                activeTaskType = null;
            }
        });

        // Telegram Share Logic
        document.getElementById('shareBtn').addEventListener('click', () => {
            let userId = tg?.initDataUnsafe?.user?.id || "user";
            let botUsername = "AltaHub_ads_bot";
            let refLink = `https://t.me/${botUsername}?start=${userId}`;
            let shareText = "Join Alta Ads Miner & claim +5 ALTA bonus!";
            
            if (tg) {
                tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=${encodeURIComponent(shareText)}`);
            } else {
                navigator.clipboard.writeText(refLink);
                showNotification("Link copied to clipboard!");
            }
        });

        // Withdrawal Logic
        openWithdrawModalBtn.addEventListener('click', () => {
            if (withdrawCount === 0) {
                if (currentAlta < MIN_WITHDRAW) return showNotification(`Min withdraw is ${MIN_WITHDRAW} ALTA!`);
                altaAmountInput.value = currentAlta.toFixed(2);
            } else {
                const maxAvailable = currentAlta - KEEP_RESERVE_BALANCE;
                if (maxAvailable < MIN_WITHDRAW) return showNotification(`2nd+ withdraw requires 300 ALTA reserve.`);
                altaAmountInput.value = maxAvailable.toFixed(2);
            }
            payoutModal.style.display = 'flex';
        });

        closeModalBtn.addEventListener('click', () => payoutModal.style.display = 'none');

        submitPayoutBtn.addEventListener('click', async () => {
            const address = tonAddressInput.value.trim();
            const username = usernameInput.value.trim();
            const withdrawAmount = parseFloat(altaAmountInput.value);

            if (!username || !address) return showNotification("Please fill all details correctly.");
            if (isNaN(withdrawAmount) || withdrawAmount < MIN_WITHDRAW) return showNotification(`Min withdraw is ${MIN_WITHDRAW} ALTA.`);

            currentAlta = parseFloat((currentAlta - withdrawAmount).toFixed(2));
            withdrawCount += 1;
            updateUI();

            const message = `<b>New Payout Request</b>\n\n` +
                            `<b>User:</b> ${username}\n` +
                            `<b>Withdraw Count:</b> ${withdrawCount}\n` +
                            `<b>Amount:</b> ${withdrawAmount.toFixed(2)} ALTA\n` +
                            `<b>TON Address:</b> <code>${address}</code>`;

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHANNEL_ID, text: message, parse_mode: 'HTML' })
                });
            } catch (err) {}

            showNotification(`Submitted: ${withdrawAmount.toFixed(2)} ALTA.`);
            payoutModal.style.display = 'none';

            if (tg) tg.openTelegramLink("https://t.me/AltaHub_ads_withdraw_history");
        });
    </script>
</body>
</html>
