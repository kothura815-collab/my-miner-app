<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Alta Ads Miner</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Ad Network Integration Scripts (Adsterra, RichAds, Monetag, AADS, HilltopAds, Clickadu) -->
    <!-- RichAds / RichInfo -->
    <script src="https://richinfo.co/richpartners/in-page/js/richads-ob.js?pubid=1021768&siteid=406146" async></script>
    <!-- Monetag / ACLib -->
    <script id="aclib" type="text/javascript" src="//acscdn.com/script/aclib.js"></script>
    <script type="text/javascript">
        if(typeof aclib !== 'undefined') {
            aclib.runAutoTag({ zoneId: 'jaxxc0ldkk' });
        }
    </script>
    <!-- Adsterra Native Scripts -->
    <script async="async" data-cfasync="false" src="https://mammothsubway.com/1cec679dbd5cf50d60afe3c148706d87/invoke.js"></script>
    <script src="https://mammothsubway.com/34/ba/b0/34bab0bd185bc292ab8ee57be14abb62.js"></script>

    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --primary-gold: #f39c12;
            --accent-blue: #0088cc;
            --btn-green: #2fa65a;
            --text-color: #ffffff;
            --danger-red: #e74c3c;
        }

        body {
            margin: 0;
            padding: 15px 0 40px 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        .ad-container-box {
            width: 90%;
            max-width: 380px;
            min-height: 75px;
            margin-bottom: 15px;
            border-radius: 12px;
            overflow: hidden;
            background: #1f293d;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .miner-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            margin-bottom: 20px;
        }

        .title { font-size: 22px; font-weight: 800; margin-bottom: 5px; }

        .balance-display {
            font-size: 38px;
            font-weight: bold;
            color: var(--primary-gold);
            margin: 5px 0;
            text-shadow: 0 0 10px rgba(243, 156, 18, 0.3);
        }

        .status { font-size: 13px; color: #2ec4b6; margin-bottom: 12px; }

        .logo-container {
            width: 110px;
            height: 110px;
            margin: 0 auto 12px auto;
            border-radius: 50%;
            padding: 5px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 0 20px rgba(243, 156, 18, 0.4);
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 15px rgba(0, 136, 204, 0.4); transform: scale(1); }
            50% { box-shadow: 0 0 30px rgba(243, 156, 18, 0.8); transform: scale(1.03); }
            100% { box-shadow: 0 0 15px rgba(0, 136, 204, 0.4); transform: scale(1); }
        }

        .coin-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .logo-container.mining .coin-img { animation: spin-coin 1s linear infinite; }

        @keyframes spin-coin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .tap-instruction { font-size: 13px; color: #8b949e; margin-bottom: 12px; }

        .btn-double-ad-main {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #e67e22, #f39c12);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            box-shadow: 0 4px 12px rgba(243, 156, 18, 0.3);
        }

        .btn-withdraw, .btn-share {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .btn-withdraw { background: linear-gradient(90deg, #27ae60, #2ecc71); }
        .btn-share { background: linear-gradient(90deg, #0088cc, #3498db); }

        .ads-feed-container {
            width: 90%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .ad-card-item {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            position: relative;
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 17, 23, 0.96);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 15px;
            box-sizing: border-box;
            z-index: 1000;
        }

        .btn-continue {
            width: 100%;
            max-width: 340px;
            padding: 14px;
            background: #234b6e;
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-continue.active {
            background: #0088cc;
            opacity: 1;
            cursor: pointer;
        }

        .payout-card {
            background: #121824;
            border: 2px solid var(--primary-gold);
            border-radius: 16px;
            padding: 20px;
            width: 85%;
            max-width: 320px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #2a3547;
            background: #090d14;
            color: #fff;
            box-sizing: border-box;
            margin-bottom: 8px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #27ae60;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .toast-popup {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f293d;
            color: #fff;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid var(--primary-gold);
            display: none;
            z-index: 2000;
            text-align: center;
            max-width: 85%;
        }

        .native-ad-placeholder {
            width: 100%;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #a0aec0;
            font-size: 12px;
            text-decoration: none;
            background: #1a202c;
            padding: 10px;
            box-sizing: border-box;
            border-radius: 8px;
        }
        .native-ad-title { font-weight: bold; color: var(--primary-gold); margin-bottom: 4px; font-size: 14px; }
    </style>
</head>
<body>

    <!-- Top Banner (Ad Network 1 - Banner Rotate) -->
    <div class="ad-container-box" id="topAdRotateBox"></div>

    <div class="miner-card">
        <div class="title">Alta Ads Miner</div>
        <div class="balance-display" id="altaBalance">0.00</div>
        <div class="status" id="systemStatus">System: Operational</div>

        <div class="logo-container" id="tapBtn">
            <img src="alta-coin.png" alt="Alta Coin" class="coin-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/6001/6001368.png'">
        </div>

        <div class="tap-instruction" id="tapInstruction">Tap to mine Alta!</div>

        <button class="btn-double-ad-main" id="doubleAdsBtn">
            <span>⚡ High CPM Ad (+0.5 ALTA)</span>
        </button>

        <button class="btn-withdraw" id="openWithdrawModal">Withdraw Alta (Min: 150 ALTA)</button>
        <button class="btn-share" id="shareBtn">Invite Friend (+5 ALTA Each)</button>
    </div>

    <!-- Feed Container (Ad Networks 2, 3, 4 Native Displays) -->
    <div class="ads-feed-container">
        <div class="ad-card-item">
            <div id="container-1cec679dbd5cf50d60afe3c148706d87"></div>
        </div>
        <div class="ad-card-item" id="middleNativeAdBox"></div>
        <div class="ad-card-item" id="bottomAdRotateBox"></div>
    </div>

    <!-- 15s Video / Modal Ad -->
    <div class="modal-overlay" id="adModal">
        <div class="ad-container-box" id="modalTopAdBox" style="margin-top: 20px;"></div>
        <div class="ad-card-item" id="modalCenterAdBox" style="width:100%; max-width:340px; height:200px;"></div>
        <button class="btn-continue" id="continueAdBtn" disabled>Please wait 15s...</button>
    </div>

    <!-- Payout Modal -->
    <div class="modal-overlay" id="payoutModal" style="justify-content: center;">
        <div class="payout-card">
            <h3 style="color: var(--primary-gold); margin-top:0; text-align:center;">Withdrawal Request</h3>
            
            <div class="input-group">
                <input type="text" id="username" placeholder="Telegram Username (@user)">
            </div>
            <div class="input-group">
                <input type="number" id="altaAmount" placeholder="Amount (Min 150 ALTA)">
            </div>
            <div class="input-group">
                <input type="text" id="tonAddress" placeholder="TON Wallet Address">
            </div>

            <button class="btn-submit" id="submitPayout">SUBMIT WITHDRAWAL</button>
            <center><button style="background:none; border:none; color:#8b949e; margin-top:10px; cursor:pointer;" id="closeModal">Cancel</button></center>
        </div>
    </div>

    <div class="toast-popup" id="customToast"></div>

    <script>
        const tg = window.Telegram?.WebApp;
        if(tg) { tg.expand(); tg.ready(); }

        const BOT_TOKEN = "8600671562:AAFYO8KewkhoCIrw_wxvfoEQvfFF4EW5iLw"; 
        const CHANNEL_ID = "@AltaHub_ads_withdraw_history";
        const MIN_WITHDRAW = 150.00;

        let currentAlta = parseFloat(localStorage.getItem('alta_balance') || '0.00');
        let withdrawCount = parseInt(localStorage.getItem('alta_withdraw_count') || '0');
        let isMining = false;
        let isAdShowing = false;
        let adStartTime = 0;

        const balanceEl = document.getElementById('altaBalance');
        balanceEl.innerText = currentAlta.toFixed(2);

        /* -------------------------------------------------------------
           High CPM Direct Links Pool (Crypto, Loan, Gaming, Forex)
           Ad Networks: Adsterra, HilltopAds, Clickadu, AADS, Monetag, RichAds
        ------------------------------------------------------------- */
        const highCpmDirectLinks = [
            'https://mammothsubway.com/rbuwwr1xk?key=f2d3ee3d88106cf8c9baceb9d7fa460a', // Adsterra High CPM
            'https://plump-plastic.com/PEwa43', // Monetag / Hilltop
            'https://plump-plastic.com/b.3gVr0JP/3xpYvYbOmGVwJLZ_D/0C3nM/zvYY3sM/zzAo1/LSTdckzvNGjvc/z/M_DmkL' // Clickadu Direct Link
        ];

        let directLinkIdx = 0;
        function getHighCpmLink() {
            const url = highCpmDirectLinks[directLinkIdx];
            directLinkIdx = (directLinkIdx + 1) % highCpmDirectLinks.length;
            return url;
        }

        /* -------------------------------------------------------------
           Safe Native Banners Dynamic Injector (Preventions for ERR_BLOCKED)
        ------------------------------------------------------------- */
        const nativeAdItems = [
            { title: "🔥 Crypto Staking 200% APY", desc: "Join Top Crypto Mining Platform Today", link: highCpmDirectLinks[0] },
            { title: "💰 Instant Personal Loan", desc: "Get approved in 5 minutes with low interest", link: highCpmDirectLinks[1] },
            { title: "🎮 Play & Earn Web3 Game", desc: "Claim free rewards and trade tokens", link: highCpmDirectLinks[2] }
        ];

        function getRandomNativeAd() {
            const ad = nativeAdItems[Math.floor(Math.random() * nativeAdItems.length)];
            return `<a href="${ad.link}" target="_blank" class="native-ad-placeholder">
                        <div class="native-ad-title">${ad.title}</div>
                        <div>${ad.desc}</div>
                    </a>`;
        }

        /* -------------------------------------------------------------
           Auto Rotate Ads Engine (6s to 12s Random Swap)
        ------------------------------------------------------------- */
        function triggerAutoRotation() {
            document.getElementById('topAdRotateBox').innerHTML = getRandomNativeAd();
            document.getElementById('bottomAdRotateBox').innerHTML = getRandomNativeAd();
            document.getElementById('middleNativeAdBox').innerHTML = getRandomNativeAd();
            document.getElementById('modalTopAdBox').innerHTML = getRandomNativeAd();
            document.getElementById('modalCenterAdBox').innerHTML = getRandomNativeAd();

            const nextInterval = Math.floor(Math.random() * (12000 - 6000 + 1)) + 6000;
            setTimeout(triggerAutoRotation, nextInterval);
        }
        triggerAutoRotation();

        function showNotification(msg) {
            const toast = document.getElementById('customToast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3500);
        }

        function saveBalance() {
            localStorage.setItem('alta_balance', currentAlta.toString());
            balanceEl.innerText = currentAlta.toFixed(2);
        }

        /* -------------------------------------------------------------
           Tap Mining Action - Direct Link Trigger
        ------------------------------------------------------------- */
        document.getElementById('tapBtn').addEventListener('click', (e) => {
            if (isMining || isAdShowing) return;

            // Direct Link သို့ ဦးစားပေးခေါ်ယူခြင်း
            window.open(getHighCpmLink(), '_blank');

            isMining = true;
            document.getElementById('tapBtn').classList.add('mining');
            document.getElementById('tapInstruction').innerText = "Mining Alta in progress...";

            let stepCount = 0;
            let interval = setInterval(() => {
                stepCount++;
                currentAlta = parseFloat((currentAlta + 0.05).toFixed(2));
                saveBalance();

                if (stepCount >= 20) {
                    clearInterval(interval);
                    document.getElementById('tapBtn').classList.remove('mining');
                    isMining = false;

                    // 15 Sec Verification Modal
                    trigger15SecModalAd(() => {
                        document.getElementById('tapInstruction').innerText = "Tap to mine Alta again!";
                    });
                }
            }, 750);
        });

        /* -------------------------------------------------------------
           15s Ad Modal & Verification
        ------------------------------------------------------------- */
        function trigger15SecModalAd(onComplete) {
            isAdShowing = true;
            const adModal = document.getElementById('adModal');
            const continueAdBtn = document.getElementById('continueAdBtn');

            adModal.style.display = 'flex';
            continueAdBtn.disabled = true;
            continueAdBtn.classList.remove('active');
            continueAdBtn.innerText = "Please wait 15s...";

            let timeLeft = 15;
            let adInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(adInterval);
                    continueAdBtn.disabled = false;
                    continueAdBtn.classList.add('active');
                    continueAdBtn.innerText = "Continue Ads Mining";
                } else {
                    continueAdBtn.innerText = `Please wait ${timeLeft}s...`;
                }
            }, 1000);

            continueAdBtn.onclick = () => {
                if (!continueAdBtn.disabled) {
                    window.open(getHighCpmLink(), '_blank');
                    adModal.style.display = 'none';
                    isAdShowing = false;
                    if(onComplete) onComplete();
                }
            };
        }

        document.getElementById('doubleAdsBtn').addEventListener('click', () => {
            adStartTime = Date.now();
            window.open(getHighCpmLink(), "_blank");
        });

        window.addEventListener('focus', () => {
            if (adStartTime > 0) {
                const elapsedSeconds = Math.floor((Date.now() - adStartTime) / 1000);
                adStartTime = 0;
                if (elapsedSeconds >= 15) {
                    currentAlta = parseFloat((currentAlta + 0.50).toFixed(2));
                    saveBalance();
                    showNotification("✅ 15s Verified! +0.50 ALTA added!");
                } else {
                    showNotification(`❌ Stayed only ${elapsedSeconds}s! Need 15s for reward.`);
                }
            }
        });

        /* -------------------------------------------------------------
           Withdrawal & Navigation
        ------------------------------------------------------------- */
        document.getElementById('openWithdrawModal').addEventListener('click', () => {
            if (currentAlta < MIN_WITHDRAW) {
                showNotification(`Minimum withdrawal is ${MIN_WITHDRAW} ALTA!`);
                return;
            }
            document.getElementById('altaAmount').value = currentAlta.toFixed(2);
            document.getElementById('payoutModal').style.display = 'flex';
        });

        document.getElementById('closeModal').addEventListener('click', () => {
            document.getElementById('payoutModal').style.display = 'none';
        });

        document.getElementById('submitPayout').addEventListener('click', async () => {
            const address = document.getElementById('tonAddress').value.trim();
            const username = document.getElementById('username').value.trim();
            const withdrawAmount = parseFloat(document.getElementById('altaAmount').value);

            if (!address || !username || isNaN(withdrawAmount) || withdrawAmount < MIN_WITHDRAW) {
                showNotification("Invalid details or amount!");
                return;
            }

            currentAlta = parseFloat((currentAlta - withdrawAmount).toFixed(2));
            saveBalance();

            const message = `<b>Withdrawal Requested</b>\nUser: ${username}\nAmount: ${withdrawAmount} ALTA\nAddress: <code>${address}</code>`;
            
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHANNEL_ID, text: message, parse_mode: 'HTML' })
                });
            } catch(e) {}

            showNotification("Withdrawal Submitted!");
            document.getElementById('payoutModal').style.display = 'none';
        });
    </script>
</body>
</html>
