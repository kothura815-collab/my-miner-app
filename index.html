<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta Ads Miner</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(23, 32, 54, 0.8);
            --accent-color: #00f2fe;
            --accent-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --btn-gradient: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            --text-color: #ffffff;
            --subtext-color: #8a99ad;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 400px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .header-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1.5px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .status-badge {
            display: inline-block;
            font-size: 12px;
            color: #38ef7d;
            background: rgba(56, 239, 125, 0.1);
            padding: 4px 12px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .balance-box {
            margin: 15px 0;
        }

        .balance-amount {
            font-size: 42px;
            font-weight: 700;
            color: #ffb703;
            text-shadow: 0 0 15px rgba(255, 183, 3, 0.3);
        }

        .logo-container {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 20px auto;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            background: radial-gradient(circle, rgba(79,172,254,0.2) 0%, rgba(0,0,0,0) 70%);
            transition: transform 0.1s ease;
        }

        .logo-container:active {
            transform: scale(0.95);
        }

        .logo-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.4);
            border: 3px solid var(--accent-color);
        }

        .tap-instruction {
            font-size: 14px;
            color: var(--subtext-color);
            margin-bottom: 25px;
        }

        .btn-withdraw {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: var(--btn-gradient);
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(56, 239, 125, 0.3);
            transition: opacity 0.2s;
        }

        .btn-withdraw:active {
            opacity: 0.8;
        }

        .rules-info {
            margin-top: 20px;
            font-size: 11px;
            color: var(--subtext-color);
            display: flex;
            justify-content: space-between;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">ALTA ADS MINER</div>
    <div class="status-badge"> System: Operational</div>

    <div class="balance-box">
        <div class="balance-amount" id="balance">0.00</div>
    </div>

    <!-- Clickable Logo -->
    <div class="logo-container" id="mineBtn">
        <img src="https://via.placeholder.com/140" alt="Alta Hub Logo" class="logo-img">
    </div>

    <div class="tap-instruction">Tap to mine Alta</div>

    <!-- Withdraw Button -->
    <button class="btn-withdraw" id="withdrawBtn"> Withdraw Alta</button>

    <!-- Rules & Limits Info -->
    <div class="rules-info">
        <span>Min Withdraw: 100 ALTA</span>
        <span>Fee: 2%</span>
        <span>Daily Limit: 1000 ALTA</span>
    </div>
</div>

<script>
    let currentBalance = 0.00;
    let dailyMined = 0;
    const DAILY_LIMIT = 1000;
    const MIN_WITHDRAW = 100;
    const FEE_PERCENT = 2;

    const balanceEl = document.getElementById('balance');
    const mineBtn = document.getElementById('mineBtn');
    const withdrawBtn = document.getElementById('withdrawBtn');

    // Tap to mine with Random Gift (1 to 10 Alta)
    mineBtn.addEventListener('click', () => {
        if (dailyMined >= DAILY_LIMIT) {
            alert("Today's limit reached! (Max 1000 ALTA/day)");
            return;
        }

        // Generate Random Reward Score between 1 and 10
        let reward = (Math.random() * (10 - 1) + 1);
        
        // Cap reward if it exceeds daily limit
        if (dailyMined + reward > DAILY_LIMIT) {
            reward = DAILY_LIMIT - dailyMined;
        }

        currentBalance += reward;
        dailyMined += reward;
        balanceEl.innerText = currentBalance.toFixed(2);
    });

    // Withdraw Logic
    withdrawBtn.addEventListener('click', () => {
        if (currentBalance < MIN_WITHDRAW) {
            alert(`Minimum withdraw amount is ${MIN_WITHDRAW} ALTA.`);
            return;
        }

        const fee = (currentBalance * FEE_PERCENT) / 100;
        const netAmount = currentBalance - fee;

        alert(`Withdrawal Request Success!\n\nRequested: ${currentBalance.toFixed(2)} ALTA\nFee (2%): ${fee.toFixed(2)} ALTA\nYou will receive: ${netAmount.toFixed(2)} ALTA`);
        
        currentBalance = 0;
        balanceEl.innerText = "0.00";
    });
</script>

</body>
</html>
