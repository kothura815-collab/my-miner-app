<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALTA Mining UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .ad-hidden { display: none; }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center p-4">

  <!-- 1. Top Fixed Ad Banner (Advertise In This Ad Space) -->
  <div class="w-full max-w-md bg-blue-500 rounded-lg p-3 mb-4 text-center shadow-lg border border-blue-400">
    <p class="font-bold text-sm">Advertise In This Ad Space</p>
    <button class="mt-1 bg-yellow-400 text-black px-3 py-1 rounded text-xs font-bold">Get started</button>
  </div>

  <!-- Main Mining Card Container -->
  <div class="w-full max-w-md bg-slate-800 rounded-2xl p-4 text-center shadow-2xl relative overflow-hidden border border-slate-700">
    
    <!-- Dynamic Popup Ad (Appears only during 15s Tap Mining Video) -->
    <div id="popAd" class="ad-hidden absolute top-0 left-0 w-full bg-slate-950/90 p-2 z-50 text-center border-b border-amber-500">
      <p class="text-xs text-amber-400 mb-1">Sponsored Ad (15s)</p>
      <img src="https://via.placeholder.com/300x100?text=15s+Special+GIF/Banner+Ad" alt="Dynamic Ad" class="mx-auto rounded h-24 object-cover">
    </div>

    <!-- ALTA Coin Icon & Main Section -->
    <div class="my-4">
      <div class="w-24 h-24 mx-auto rounded-full bg-gradient-to-tr from-amber-500 to-yellow-300 p-1 shadow-lg flex items-center justify-center">
        <span class="text-2xl font-black text-slate-900">ALTA</span>
      </div>
      <p class="text-xs text-slate-400 mt-2">Tap to mine Alta again!</p>
    </div>

    <!-- Action Buttons -->
    <div class="space-y-2">
      <button onclick="startMiningProcess()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-sm transition">
        Withdraw Alta (Min: 150)
      </button>
      <button class="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-2.5 rounded-xl text-sm transition">
        Invite Friend (+5 ALTA Each)
      </button>
    </div>
  </div>

  <!-- 2. Section Title -->
  <div class="w-full max-w-md text-center my-4">
    <h3 class="text-amber-400 font-bold text-base">Double Ads 15s ⬇️</h3>
  </div>

  <!-- 3. Bottom Auto-Rotating High-CPM Ads Feed -->
  <div class="w-full max-w-md space-y-3">
    
    <!-- Football Ad Card (Fixed Image Path) -->
    <div class="bg-slate-800 rounded-xl overflow-hidden border border-slate-700 shadow-md">
      <img src="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=500&q=80" alt="Football" class="w-full h-36 object-cover">
      <p class="p-2 text-xs text-center font-semibold text-slate-300">Watch Football For FREE</p>
    </div>

    <!-- Auto-Rotating High CPM Ad Slot -->
    <div class="bg-slate-800 rounded-xl overflow-hidden border border-slate-700 shadow-md">
      <img id="cpmAdImage" src="" alt="CPM Ad" class="w-full h-36 object-cover transition-opacity duration-500">
      <p id="cpmAdText" class="p-2 text-xs text-center font-semibold text-slate-300"></p>
    </div>

  </div>

  <!-- Ad Control & Rotation Logic -->
  <script>
    // 1. Double Ads 15s Trigger Logic
    function startMiningProcess() {
      const popAd = document.getElementById('popAd');
      
      // Show Banner/GIF Ad
      popAd.classList.remove('ad-hidden');
      
      // Auto Hide after 15 seconds
      setTimeout(() => {
        popAd.classList.add('ad-hidden');
      }, 15000);
    }

    // 2. High-CPM Auto Rotate Ads Data (No Click Needed - Impression Income)
    const cpmAds = [
      {
        img: "https://images.unsplash.com/photo-1596838132731-3301c3fd4317?w=500&q=80",
        text: "Real win. No streamer fake. Spin"
      },
      {
        img: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&q=80",
        text: "Chat with Instagram models"
      },
      {
        img: "https://images.unsplash.com/photo-1485846234645-a62644f84728?w=500&q=80",
        text: "The Devil Wears Prada 2: Watch in HD for FREE"
      }
    ];

    let currentAdIndex = 0;

    function rotateCPMAds() {
      const adImg = document.getElementById('cpmAdImage');
      const adText = document.getElementById('cpmAdText');
      
      adImg.src = cpmAds[currentAdIndex].img;
      adText.innerText = cpmAds[currentAdIndex].text;

      // Next Ad Loop
      currentAdIndex = (currentAdIndex + 1) % cpmAds.length;
    }

    // Initial Load & Rotate every 10 seconds
    rotateCPMAds();
    setInterval(rotateCPMAds, 10000);
  </script>
</body>
</html>
