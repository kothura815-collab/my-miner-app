<body>

    <div class="ad-banner-top" id="topAdSlot">

    <div class="miner-card">

        <div class="tap-instruction" id="tapInstruction">Tap to start mining Alta</div>
        <button class="btn-withdraw" id="openWithdrawModal">Withdraw Alta (Min: 50)</button>

    <div class="modal-overlay" id="adModal">

        <div class="ad-modal-content">

    <div class="modal-overlay" id="payoutModal" style="justify-content: center;">

            <button class="btn-submit" id="submitPayout">SUBMIT REQUEST</button>

    <script>
        const tg = window.Telegram?.WebApp;
        if(tg) tg.expand();

        const BOT_TOKEN = "8600671562:AAFYO8KewkhoCIrw_wxvfoEQvfFF4EW5iLw"; 
        const CHANNEL_ID = "@AltaHub_ads_withdraw_history";
        const MIN_WITHDRAW = 50.00;

        let currentAlta = parseFloat(localStorage.getItem('alta_balance') || '0.00');
        let adIndex = 0;
        let isMining = false;
        let isAdShowing = false;
        let lastTapTime = 0;

        const balanceEl = document.getElementById('altaBalance');
        balanceEl.innerText = currentAlta.toFixed(2);

        const tapBtn = document.getElementById('tapBtn');
        const tapInstruction = document.getElementById('tapInstruction');
        const payoutModal = document.getElementById('payoutModal');
        const adModal = document.getElementById('adModal');
        const adTimerEl = document.getElementById('adTimer');
        const continueAdBtn = document.getElementById('continueAdBtn');
        const adBoxContainer = document.getElementById('adBoxContainer');

        const openWithdrawModalBtn = document.getElementById('openWithdrawModal');
        const closeModalBtn = document.getElementById('closeModal');
        const submitPayoutBtn = document.getElementById('submitPayout');
        const shareBtn = document.getElementById('shareBtn');
        
        const usernameInput = document.getElementById('username');
        const altaAmountInput = document.getElementById('altaAmount');
        const tonAddressInput = document.getElementById('tonAddress');
        const addressError = document.getElementById('addressError');

        if (tg && tg.initDataUnsafe?.user?.username) {
            usernameInput.value = "@" + tg.initDataUnsafe.user.username;
        }

        function saveBalance() {
            localStorage.setItem('alta_balance', currentAlta.toString());
            balanceEl.innerText = currentAlta.toFixed(2);
        }

        // Dual Referral Bonus (+5 for New User & Inviter)
        const urlParams = new URLSearchParams(window.location.search);
        const startParam = urlParams.get('start') || tg?.initDataUnsafe?.start_param;
        if (startParam && !localStorage.getItem('ref_claimed')) {
            currentAlta += 5.00;
            saveBalance();
            localStorage.setItem('ref_claimed', 'true');
            
            // Notify Inviter via Bot API
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    chat_id: startParam, 
                    text: "🎉 ဝမ်းသာစရာ သတင်းပါ။ သင့် Invite Link ဖြင့် သူငယ်ချင်းတစ်ဦး ဝင်ရောက်လာသောကြောင့် +5.00 ALTA Bonus ရရှိပါပြီ။" 
                })
            }).catch(e => console.log(e));

            alert("ကြိုဆိုပါတယ်! Referral Bonus အဖြစ် +5.00 ALTA ရရှိပြီး သင်နှင့် ဖိတ်ခေါ်သူ နှစ်ဦးလုံး Bonus ရရှိပါပြီ။");
        }

        // Non-18+ Clean Ads & Direct Links (Games, Finance, Loans)
        const adsList = [
            { type: 'iframe', src: 'https://acceptable.a-ads.com/2453653/?size=Adaptive' },
            { type: 'iframe', src: 'https://acceptable.a-ads.com/2453769/?size=Adaptive' },
            { type: 'popup', url: 'https://plump-plastic.com/bA3OV.0fPz3OpKv_bPmxVCJ/Z-Ds0P3IMLzqY/1vMmjAYM5/LBTTc/zMNtj/UryzNEzVMy' },
            { type: 'popup', url: 'https://www.profitableratecpmnetwork.com/x18ziza6?key=b5e077d7dc21f4b333cf83484676dc43' }
        ];

        // Trigger Popups/Ads continuously to increase CPM
        function renderNextAd() {
            adBoxContainer.innerHTML = '';
            let currentAd = adsList[adIndex];

            if (currentAd.type === 'iframe') {
                adBoxContainer.innerHTML = `<iframe src='${currentAd.src}' style='border:0; padding:0; width:100%; height:100%; overflow:hidden;'></iframe>`;
            } else if (currentAd.type === 'popup') {
                adBoxContainer.innerHTML = `
                    <div style="color:#fff; padding:15px;">
                        <h4 style="color:#2fa65a; margin:0 0 10px 0;">Special Offer Available!</h4>
                        <p style="font-size:12px; color:#8b949e;">Check out the latest sponsor offers (Games / Rewards).</p>
                        <a href="${currentAd.url}" target="_blank" style="display:inline-block; margin-top:5px; padding:8px 15px; background:#0088cc; color:#fff; text-decoration:none; border-radius:6px; font-weight:bold;">[ Open Offer ]</a>
                    </div>`;
                // Open Pop-up window automatically
                window.open(currentAd.url, '_blank');
            }

            adIndex = (adIndex + 1) % adsList.length;
        }

        // 15-Second Ad Stream with 5-Second Interval Rotation
        function trigger15SecAdStream(onComplete) {
            isAdShowing = true;
            adModal.style.display = 'flex';
            continueAdBtn.disabled = true;
            continueAdBtn.classList.remove('active');
            continueAdBtn.innerText = "Please wait...";

            renderNextAd();
            let timeLeft = 15;
            adTimerEl.innerText = `00:${timeLeft < 10 ? '0' : ''}${timeLeft}`;

            let adInterval = setInterval(() => {
                // Offline Check
                if (!navigator.onLine) {
                    alert("အင်တာနက် လိုင်းကျသွားသဖြင့် Ad Stream ရပ်တန့်သွားပါပြီ။");
                    clearInterval(adInterval);
                    adModal.style.display = 'none';
                    isAdShowing = false;
                    return;
                }

                timeLeft--;
                adTimerEl.innerText = `00:${timeLeft < 10 ? '0' : ''}${timeLeft}`;
                
                // Rotate every 5 seconds
                if (timeLeft % 5 === 0 && timeLeft > 0) {
                    renderNextAd();
                }

                if (timeLeft <= 0) {
                    clearInterval(adInterval);
                    continueAdBtn.disabled = false;
                    continueAdBtn.classList.add('active');
                    continueAdBtn.innerText = "Continue";
                }
            }, 1000);

            continueAdBtn.onclick = () => {
                if (!continueAdBtn.disabled) {
                    adModal.style.display = 'none';
                    isAdShowing = false;
                    onComplete();
                }
            };
        }

        // Tap Logic with Anti-Auto Clicker & Offline Protection
        tapBtn.addEventListener('click', (e) => {
            if (!navigator.onLine) {
                alert("Point များ မိုင်းလုပ်ရန် အင်တာနက်လိုင်း ချိတ်ဆက်ထားရန် လိုအပ်ပါသည်။");
                return;
            }

            // Anti-Auto Clicker (under 300ms or programmatic triggers)
            const currentTime = new Date().getTime();
            if ((currentTime - lastTapTime < 300) || !e.isTrusted) {
                alert("Auto-Clicker အသုံးပြုခွင့် မရှိပါ။ လက်ဖြင့်သာ နှိပ်ပေးပါ။");
                return;
            }
            lastTapTime = currentTime;

            if (isMining || isAdShowing) return;

            isMining = true;
            tapBtn.classList.add('mining');
            tapInstruction.innerText = "Mining Alta in progress...";

            let targetAlta = currentAlta + 1.00;
            let totalSteps = 20; 
            let stepInterval = 500; // 10 Sec duration

            let stepCount = 0;
            let interval = setInterval(() => {
                if (!navigator.onLine) {
                    clearInterval(interval);
                    tapBtn.classList.remove('mining');
                    isMining = false;
                    alert("အင်တာနက်ပြတ်သွားသဖြင့် Mining ရပ်တန့်သွားပါပြီ။");
                    return;
                }

                stepCount++;
                currentAlta = parseFloat((currentAlta + 0.05).toFixed(2));
                saveBalance();

                if (stepCount >= totalSteps) {
                    clearInterval(interval);
                    currentAlta = parseFloat(targetAlta.toFixed(2));
                    saveBalance();
                    tapBtn.classList.remove('mining');
                    isMining = false;

                    // Trigger Ad Loop Stream
                    trigger15SecAdStream(() => {
                        tapInstruction.innerText = "Tap to mine Alta again!";
                    });
                }
            }, stepInterval);
        });

        // Share & Invite Logic
        shareBtn.addEventListener('click', () => {
            let userId = tg?.initDataUnsafe?.user?.id || "user";
            let botUsername = "AltaHub_ads_bot";
            let refLink = `https://t.me/${botUsername}?start=${userId}`;
            
            if (tg) {
                tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=${encodeURIComponent("Alta Miner တွင် ပါဝင်ပြီး +5 ALTA Bonus ရယူလိုက်ပါ!")}`);
            } else {
                navigator.clipboard.writeText(refLink);
                alert("Invite Link ကူးယူပြီးပါပြီ- " + refLink);
            }
        });

        // Withdraw Request Handling (Min 50 Limit)
        openWithdrawModalBtn.addEventListener('click', () => {
            if (currentAlta < MIN_WITHDRAW) {
                alert(`အနည်းဆုံး ထုတ်ယူနိုင်သည့် ပမာဏမှာ ${MIN_WITHDRAW} ALTA ဖြစ်ပါသည်။ လက်ရှိလက်ကျန်: ${currentAlta.toFixed(2)} ALTA`);
                return;
            }
            altaAmountInput.value = currentAlta.toFixed(2);
            addressError.style.display = 'none';
            payoutModal.style.display = 'flex';
        });

        closeModalBtn.addEventListener('click', () => {
            payoutModal.style.display = 'none';
        });

        submitPayoutBtn.addEventListener('click', async () => {
            const address = tonAddressInput.value.trim();
            const username = usernameInput.value.trim();
            const tonRegex = /^(UQ|EQ)[a-zA-Z0-9_-]{46}$/;

            if (!tonRegex.test(address)) {
                addressError.style.display = 'block';
                return;
            }

            addressError.style.display = 'none';
            let withdrawAmount = currentAlta.toFixed(2);

            // Deduct balance and save
            currentAlta = 0.00;
            saveBalance();

            const message = `<b>New Payout Request</b>\n\n` +
                            `<b>User:</b> ${username}\n` +
                            `<b>Amount:</b> ${withdrawAmount} ALTA\n` +
                            `<b>TON Address:</b> <code>${address}</code>\n` +
                            `<b>Status:</b> Pending`;

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHANNEL_ID, text: message, parse_mode: 'HTML' })
                });
            } catch (err) { console.error(err); }

            alert(`Payout Request ပေးပို့ပြီးပါပြီ!\nထုတ်ယူပမာဏ: ${withdrawAmount} ALTA`);
            payoutModal.style.display = 'none';

            if (tg) tg.openTelegramLink("https://t.me/AltaHub_ads_withdraw_history");
            else window.open("https://t.me/AltaHub_ads_withdraw_history", "_blank");
        });
    </script>
