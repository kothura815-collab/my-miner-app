            box-shadow: 0 0 25px rgba(243, 156, 18, 0.65), inset 0 0 15px rgba(255, 255, 255, 0.3);

        .coin-img { 
            width: 100%;

            border-radius: 50%; 
            object-fit: cover; 
            filter: drop-shadow(0 0 8px rgba(243, 156, 18, 0.8));
        }

        .logo-container.mining .coin-img { 
            animation: spin-coin 0.8s linear infinite;

        @keyframes spin-coin {
            0% { transform: rotateY(0deg); }

        .tap-instruction { font-size: 13px; color: #8b949e; margin-bottom: 14px; }

        .toast-popup {

            z-index: 99999;

            max-width: 85%;

    <script>
        // ANTI-HACKING & DEVTOOLS GUARD
        (function() {
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', e => {
                if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || (e.ctrlKey && e.keyCode === 85)) {
                    e.preventDefault();
                    return false;
                }
            });

            setInterval(() => {
                const startTime = performance.now();
                debugger;
                const endTime = performance.now();
                if (endTime - startTime > 100) {
                    document.body.innerHTML = "<h1>Unauthorized Inspection Detected!</h1>";
                }
            }, 1000);
        })();

        // Anti-Auto Clicker Logic
        let lastTapTime = 0;
        let lastX = 0;
        let lastY = 0;

        function isAutoClicker(e) {
            const now = Date.now();
            const timeDiff = now - lastTapTime;
            const currentX = e.clientX || 0;
            const currentY = e.clientY || 0;

            if (timeDiff < 350 || (currentX === lastX && currentY === lastY && currentX !== 0)) {
                showNotification("Auto Clicker / Fast Click Detected!");
                return true;
            }

            lastTapTime = now;
            lastX = currentX;
            lastY = currentY;
            return false;
        }

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js').catch(() => {});
            });
        }

        let tg = null;
        window.addEventListener('DOMContentLoaded', () => {
            tg = window.Telegram?.WebApp;
            if(tg) { tg.expand(); tg.ready(); }
            if (tg && tg.initDataUnsafe?.user?.username) {
                usernameInput.value = "@" + tg.initDataUnsafe.user.username;
            }
        });

        const MIN_WITHDRAW = 150.00;
        const KEEP_RESERVE_BALANCE = 300.00;

        let currentAlta = parseFloat(localStorage.getItem('alta_balance') || '0.00');
        let highAdsCount = parseInt(localStorage.getItem('high_ads_count') || '0');
        let bonusCount = parseInt(localStorage.getItem('bonus_count') || '0');
        let withdrawCount = parseInt(localStorage.getItem('alta_withdraw_count') || '0');
        
        let lastResetTime = parseInt(localStorage.getItem('last_daily_reset') || '0');
        const NOW = Date.now();
        const TWENTY_FOUR_HOURS = 24 * 60 * 60 * 1000;

        if (!lastResetTime) {
            localStorage.setItem('last_daily_reset', NOW.toString());
        } else if (NOW - lastResetTime >= TWENTY_FOUR_HOURS) {
            highAdsCount = 0;
            bonusCount = 0;
            localStorage.setItem('high_ads_count', '0');
            localStorage.setItem('bonus_count', '0');
            localStorage.setItem('last_daily_reset', NOW.toString());
        }

        let isMining = false;
        let toastTimeout = null;

        const balanceEl = document.getElementById('altaBalance');
        const tapBtn = document.getElementById('tapBtn');
        const tapInstruction = document.getElementById('tapInstruction');
        const adModal = document.getElementById('adModal');
        const continueAdBtn = document.getElementById('continueAdBtn');
        const customToast = document.getElementById('customToast');
        const offlineBar = document.getElementById('offlineBar');

        const highAdsCounter = document.getElementById('highAdsCounter');
        const bonusCounter = document.getElementById('bonusCounter');

        const payoutModal = document.getElementById('payoutModal');
        const openWithdrawModalBtn = document.getElementById('openWithdrawModal');
        const closeModalBtn = document.getElementById('closeModal');
        const submitPayoutBtn = document.getElementById('submitPayout');
        const usernameInput = document.getElementById('username');
        const altaAmountInput = document.getElementById('altaAmount');
        const tonAddressInput = document.getElementById('tonAddress');

        function checkNetworkStatus() {
            if (!navigator.onLine) {
                offlineBar.style.display = 'block';
                document.body.classList.add('is-offline');
                showNotification("Internet connection lost! Mining disabled.");
                if (isMining) {
                    isMining = false;
                    tapBtn.classList.remove('mining');
                    tapInstruction.innerText = "Connection Lost! Tap disabled.";
                }
            } else {
                offlineBar.style.display = 'none';
                document.body.classList.remove('is-offline');
                if (!isMining) tapInstruction.innerText = "Tap to mine Alta!";
            }
        }
        window.addEventListener('online', checkNetworkStatus);
        window.addEventListener('offline', checkNetworkStatus);

        function updateUI() {
            balanceEl.innerText = currentAlta.toFixed(2);
            highAdsCounter.innerText = `${highAdsCount}/100 (+1 ALTA)`;
            bonusCounter.innerText = `${bonusCount}/30 (+1~3 ALTA)`;
            localStorage.setItem('alta_balance', currentAlta.toString());
            localStorage.setItem('high_ads_count', highAdsCount.toString());
            localStorage.setItem('bonus_count', bonusCount.toString());
            localStorage.setItem('alta_withdraw_count', withdrawCount.toString());
        }
        updateUI();
        checkNetworkStatus();

        function showNotification(msg) {
            if (toastTimeout) clearTimeout(toastTimeout);
            customToast.innerText = msg;
            customToast.style.display = 'block';
            toastTimeout = setTimeout(() => { 
                customToast.style.display = 'none'; 
            }, 3500);
        }

        // DIRECT LINKS POOL (Adsterra & HilltopAds)
        const directLinksPool = [
            'https://mammothsubway.com/rj0adayj?key=b1b9b60a34e0cd221a97d742cd97b6cb', // Adsterra Smartlink 1
            'https://mammothsubway.com/rbuwwr1xk?key=f2d3ee3d88106cf8c9baceb9d7fa460a', // Adsterra Smartlink 2
            'https://plump-plastic.com/bd3AVU0NP.3/plvebXmJVuJ/ZyDt0f3/Msz-YB3mMBzqAK1gLWTkcVzkNPjcc/zVMKD/kV', // Hilltop Direct 1
            'https://plump-plastic.com/PEwa43' // Hilltop Direct 2
        ];
        
        let linkIndex = 0;
        function openNextDirectLink() {
            try {
                const targetUrl = directLinksPool[linkIndex];
                linkIndex = (linkIndex + 1) % directLinksPool.length;
                window.open(targetUrl, '_blank');
            } catch (e) {
                console.error("Direct Link Error", e);
            }
        }

        tapBtn.addEventListener('click', (e) => {
            if (!navigator.onLine) return showNotification("No Internet! Cannot mine Alta.");
            if (isAutoClicker(e)) return;
            if (isMining) return;

            isMining = true;
            openNextDirectLink();

            tapBtn.classList.add('mining');
            tapInstruction.innerText = "Mining Alta in progress...";

            let stepCount = 0;
            let interval = setInterval(() => {
                if (!navigator.onLine) {
                    clearInterval(interval);
                    tapBtn.classList.remove('mining');
                    isMining = false;
                    tapInstruction.innerText = "Mining stopped! Internet lost.";
                    showNotification("Mining interrupted due to connection loss.");
                    return;
                }

                stepCount++;
                currentAlta = parseFloat((currentAlta + 0.05).toFixed(2));
                updateUI();

                if (stepCount >= 20) {
                    clearInterval(interval);
                    tapBtn.classList.remove('mining');
                    isMining = false;

                    run15SecModalAd(() => {
                        tapInstruction.innerText = "Tap to mine Alta again!";
                        showNotification("Mining Cycle Complete! Reward Added!");
                    });
                }
            }, 750);
        });

        function run15SecModalAd(onCompleteReward) {
            adModal.style.display = 'flex';
            continueAdBtn.disabled = true;
            continueAdBtn.classList.remove('active');
            continueAdBtn.innerText = "Please wait 15s...";

            let timeLeft = 15;
            let adInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(adInterval);
                    continueAdBtn.disabled = false;
                    continueAdBtn.classList.add('active');
                    continueAdBtn.innerText = "Claim Reward & Continue";
                } else {
                    continueAdBtn.innerText = `Please wait ${timeLeft}s...`;
                }
            }, 1000);

            continueAdBtn.onclick = () => {
                if (!continueAdBtn.disabled) {
                    openNextDirectLink(); // Trigger Direct Link on Continue click
                    adModal.style.display = 'none';
                    if(onCompleteReward) onCompleteReward();
                }
            };
        }

        document.getElementById('doubleAdsBtn').addEventListener('click', (e) => {
            if (!navigator.onLine) return showNotification("No Internet! Action disabled.");
            if (isAutoClicker(e)) return;

            openNextDirectLink();
            run15SecModalAd(() => {
                currentAlta = parseFloat((currentAlta + 0.50).toFixed(2));
                updateUI();
                showNotification("SUCCESS: +0.50 ALTA Double Bonus Added!");
            });
        });

        document.getElementById('highAdsBtn').addEventListener('click', (e) => {
            if (!navigator.onLine) return showNotification("No Internet! Action disabled.");
            if (isAutoClicker(e)) return;
            if (highAdsCount >= 100) return showNotification("Daily High Ads limit reached (100/100)!");

            openNextDirectLink();
            run15SecModalAd(() => {
                highAdsCount++;
                currentAlta = parseFloat((currentAlta + 1.00).toFixed(2));
                updateUI();
                showNotification(`SUCCESS: +1.00 ALTA Added (${highAdsCount}/100)`);
            });
        });

        document.getElementById('dailyBonusBtn').addEventListener('click', (e) => {
            if (!navigator.onLine) return showNotification("No Internet! Action disabled.");
            if (isAutoClicker(e)) return;
            if (bonusCount >= 30) return showNotification("Daily Bonus limit reached (30/30)!");

            openNextDirectLink();
            run15SecModalAd(() => {
                bonusCount++;
                const bonus = Math.floor(Math.random() * 3) + 1;
                currentAlta = parseFloat((currentAlta + bonus).toFixed(2));
                updateUI();
                showNotification(`SUCCESS: +${bonus}.00 ALTA Bonus Added (${bonusCount}/30)`);
            });
        });

        document.getElementById('shareBtn').addEventListener('click', (e) => {
            if (!navigator.onLine) return showNotification("No Internet! Action disabled.");
            if (isAutoClicker(e)) return;

            let userId = tg?.initDataUnsafe?.user?.id || "user";
            let botUsername = "AltaHub_ads_bot";
            let refLink = `https://t.me/${botUsername}?start=${userId}`;
            let shareText = "Join Alta Ads Miner & claim +5 ALTA bonus!";
            
            if (tg) {
                tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=${encodeURIComponent(shareText)}`);
            } else {
                navigator.clipboard.writeText(refLink);
                showNotification("Link copied to clipboard!");
            }
        });

        // Withdrawal Modal Handlers
        openWithdrawModalBtn.addEventListener('click', () => {
            if (!navigator.onLine) return showNotification("No Internet! Cannot open withdrawal.");
            
            if (withdrawCount === 0) {
                if (currentAlta < MIN_WITHDRAW) return showNotification(`Min withdraw is ${MIN_WITHDRAW} ALTA!`);
                altaAmountInput.value = currentAlta.toFixed(2);
            } else {
                const maxAvailable = currentAlta - KEEP_RESERVE_BALANCE;
                if (maxAvailable < MIN_WITHDRAW) {
                    return showNotification(`2nd+ withdraw requires 300 ALTA reserve. (Min withdraw: 150 ALTA)`);
                }
                altaAmountInput.value = maxAvailable.toFixed(2);
            }
            payoutModal.style.display = 'flex';
        });

        closeModalBtn.addEventListener('click', () => payoutModal.style.display = 'none');

        // Submit Withdrawal Payout to Serverless Endpoint
        submitPayoutBtn.addEventListener('click', async () => {
            if (!navigator.onLine) return showNotification("No Internet! Cannot submit payout.");
            const address = tonAddressInput.value.trim();
            const username = usernameInput.value.trim();
            const withdrawAmount = parseFloat(altaAmountInput.value);

            if (!username || !address) return showNotification("Please fill all details correctly.");
            if (isNaN(withdrawAmount) || withdrawAmount < MIN_WITHDRAW) return showNotification(`Min withdraw is ${MIN_WITHDRAW} ALTA.`);

            if (withdrawCount > 0) {
                const remainingBalance = currentAlta - withdrawAmount;
                if (remainingBalance < KEEP_RESERVE_BALANCE) {
                    return showNotification(`You must keep 300 ALTA reserve balance for 2nd+ withdrawal.`);
                }
            }

            currentAlta = parseFloat((currentAlta - withdrawAmount).toFixed(2));
            withdrawCount += 1;
            updateUI();

            try {
                const res = await fetch('/api/withdraw', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: username,
                        withdrawCount: withdrawCount,
                        withdrawAmount: withdrawAmount,
                        address: address
                    })
                });
                
                const data = await res.json();
                if (res.ok && data.success) {
                    showNotification(`Submitted: ${withdrawAmount.toFixed(2)} ALTA.`);
                } else {
                    showNotification(`Notice: ${data.error || "Submission received"}`);
                }
            } catch (err) {
                showNotification("Network Error: Request queued.");
            }

            payoutModal.style.display = 'none';
            if (tg) tg.openTelegramLink("https://t.me/Allwithdrawhistory");
        });
    </script>
</body>
</html>
