<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Alta Ads Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ... same root and general styles ... */
        .ad-banner-top {
            display: none; /* Hide top ad banner as requested */
        }
        /* New style for the Double Ads button */
        .btn-double-ads {
            background: linear-gradient(135deg, #e67e22, #d35400); /* Orange-brown gradient */
            color: white;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            transition: transform 0.2s;
        }
        .btn-double-ads:active { transform: scale(0.98); }
        /* Add CSS for countdown timer overlay (optional, but good for UX) */
        .ad-countdown-overlay {
            /* ... style for countdown overlay ... */
        }
    </style>
</head>
<body>
    <div class="ad-banner-top" style="display:none;"></div> 

    <div class="miner-card">
        <button class="btn-double-ads" id="doubleAdsBtn">Double Ads 15s</button>
        
        </div>

    <div class="modal-overlay" id="payoutModal" style="justify-content: center;">
        <div class="input-group">
            <input type="number" id="altaAmount" placeholder="Alta Points (Min: 50, Max: 1000)">
            <div class="error-msg" id="balanceKeepError" style="display:none;">Please keep at least 150 Alta in your balance for future withdrawals.</div>
        </div>
        </div>

    <div class="toast-popup" id="customToast"></div>

    <script>
        /* ... standard variable definitions ... */
        const KEEP_BALANCE = 150.00; // Minimum balance required after first withdrawal
        const DOUBLE_ADS_REWARD = 0.5; // Reward amount for Double Ads
        const DOUBLE_ADS_DURATION = 15; // 15 seconds

        let firstWithdrawalDone = localStorage.getItem('firstWithdrawalDone') === 'true' || false;
        let isAdWatching = false; // Flag to check if currently watching a Double Ad

        const doubleAdsBtn = document.getElementById('doubleAdsBtn');

        doubleAdsBtn.addEventListener('click', () => {
            if (isMining || isAdShowing || isAdWatching) return; // Don't allow multiple ad sessions

            isAdWatching = true;
            doubleAdsBtn.disabled = true; // Prevent multiple clicks
            
            // Logic to play high-value 15s ads (you'll need to integrate this with your ad provider)
            // Example using a placeholder:
            showNotification("Watching high-value ads. Please wait 15 seconds.");

            let timeLeft = DOUBLE_ADS_DURATION;
            let adInterval = setInterval(() => {
                // You can add countdown display logic here (e.g., in a separate overlay)
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(adInterval);
                    doubleAdsBtn.disabled = false; // Re-enable the button
                    isAdWatching = false;
                    currentAlta += DOUBLE_ADS_REWARD;
                    saveBalance();
                    showNotification(`Added ${DOUBLE_ADS_REWARD.toFixed(1)} Alta for watching Double Ads!`);
                }
            }, 1000);

            // Back button handling logic to prevent reward if user leaves early
            // This requires detecting the back button event which is browser-dependent
            // For Telegram WebApp, you can use `tg.onEvent('backButtonClicked', ...)`
            if (tg) {
                tg.onEvent('backButtonClicked', () => {
                    if (isAdWatching) {
                        clearInterval(adInterval);
                        doubleAdsBtn.disabled = false;
                        isAdWatching = false;
                        showNotification("Ad not completed. No reward added.");
                        tg.close(); // Close WebApp or handle as needed
                    }
                });
            }
            // For web browsers, you might need complex back button detection/prevention.
            // ... (requires specialized web development techniques) ...
        });

        /* ... existing submit payout handler ... */
        submitPayoutBtn.addEventListener('click', async () => {
            /* ... existing validation logic ... */

            if (firstWithdrawalDone) {
                if (withdrawAmount > (currentAlta - KEEP_BALANCE)) {
                    showNotification(`You must keep at least ${KEEP_BALANCE.toFixed(0)} Alta in your balance. Max withdrawal: ${(currentAlta - KEEP_BALANCE).toFixed(2)} Alta.`);
                    return;
                }
            } else if (withdrawAmount < MIN_WITHDRAW) {
                showNotification(`Minimum withdrawal is ${MIN_WITHDRAW} ALTA.`);
                return;
            }

            /* ... existing logic to update balance and send payout request ... */
            if (!firstWithdrawalDone) {
                firstWithdrawalDone = true;
                localStorage.setItem('firstWithdrawalDone', 'true');
            }
        });
    </script>
</body>
</html>
