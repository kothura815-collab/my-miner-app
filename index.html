<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Alta Ads Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --primary-gold: #f39c12;
            --accent-blue: #0088cc;
            --btn-green: #2fa65a;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        .miner-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            width: 85%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }

        .title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .balance-display {
            font-size: 42px;
            font-weight: bold;
            color: var(--primary-gold);
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(243, 156, 18, 0.3);
        }

        .status {
            font-size: 13px;
            color: #2ec4b6;
            margin-bottom: 20px;
        }

        /* Animated Glowing & Rotating Coin Logo */
        .logo-container {
            width: 170px;
            height: 170px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            padding: 5px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 0 20px rgba(243, 156, 18, 0.4);
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 15px rgba(0, 136, 204, 0.4); transform: scale(1); }
            50% { box-shadow: 0 0 30px rgba(243, 156, 18, 0.8); transform: scale(1.03); }
            100% { box-shadow: 0 0 15px rgba(0, 136, 204, 0.4); transform: scale(1); }
        }

        .coin-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .logo-container.mining .coin-img {
            animation: spin-coin 3s linear infinite;
        }

        @keyframes spin-coin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .tap-instruction {
            font-size: 14px;
            color: #8b949e;
            margin-bottom: 20px;
        }

        .btn-withdraw {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #27ae60, #2ecc71);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Modal Overlays */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .payout-card {
            background: #121824;
            border: 2px solid var(--primary-gold);
            border-radius: 16px;
            padding: 20px;
            width: 85%;
            max-width: 320px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .payout-card h3 {
            color: var(--primary-gold);
            margin-top: 0;
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group {
            margin-bottom: 12px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #2a3547;
            background: #090d14;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #27ae60;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .btn-cancel {
            background: transparent;
            border: none;
            color: #8b949e;
            margin-top: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 11px;
            margin-top: 4px;
            display: none;
        }

        /* Ads Modal */
        .ad-modal-card {
            background: #161b22;
            border: 2px solid var(--accent-blue);
            border-radius: 16px;
            padding: 30px 20px;
            width: 80%;
            max-width: 300px;
            text-align: center;
        }

        .ad-timer {
            font-size: 38px;
            font-weight: bold;
            color: var(--primary-gold);
            margin: 15px 0;
        }

        /* Withdrawal History Section */
        .history-section {
            margin-top: 15px;
            text-align: left;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 10px;
        }

        .history-title {
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 5px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            background: #090d14;
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 5px;
        }

        .badge-pending {
            color: #f39c12;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="miner-card">
        <div class="title">Alta Ads Miner</div>
        <div class="balance-display" id="altaBalance">0.00</div>
        <div class="status" id="systemStatus">System: Operational</div>

        <div class="logo-container" id="tapBtn">
            <img src="alta-coin.png" alt="Alta Coin" class="coin-img">
        </div>

        <div class="tap-instruction" id="tapInstruction">Tap to start mining Alta</div>
        <button class="btn-withdraw" id="openWithdrawModal">Withdraw Alta</button>

        <!-- Withdrawal History List -->
        <div class="history-section">
            <div class="history-title">Withdrawal History</div>
            <div id="historyList">
                <div style="font-size: 11px; color: #555; text-align: center;">No withdrawal requests yet</div>
            </div>
        </div>
    </div>

    <!-- Ads Modal -->
    <div class="modal-overlay" id="adModal">
        <div class="ad-modal-card">
            <h3 style="color: var(--accent-blue); margin: 0;">Sponsor Ad</h3>
            <p style="font-size: 13px; color: #8b949e; margin-top: 5px;">Ad is playing. Please wait...</p>
            <div class="ad-timer" id="adTimer">15</div>
        </div>
    </div>

    <!-- Payout Request Modal -->
    <div class="modal-overlay" id="payoutModal">
        <div class="payout-card">
            <h3>Payout Request</h3>
            
            <div class="input-group">
                <input type="text" id="username" placeholder="@username">
            </div>

            <div class="input-group">
                <input type="number" id="altaAmount" placeholder="Alta Points Amount" readonly>
            </div>

            <div class="input-group">
                <input type="text" id="tonAddress" placeholder="TON Address">
                <div class="error-msg" id="addressError">Invalid TON Address! Must start with UQ or EQ.</div>
            </div>

            <button class="btn-submit" id="submitPayout">SUBMIT REQUEST</button>
            <center><button class="btn-cancel" id="closeModal">Cancel</button></center>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if(tg) tg.expand();

        let currentAlta = 0.00;
        let isMining = false;
        let isAdShowing = false;
        let withdrawalHistory = [];

        const balanceEl = document.getElementById('altaBalance');
        const tapBtn = document.getElementById('tapBtn');
        const tapInstruction = document.getElementById('tapInstruction');
        const systemStatus = document.getElementById('systemStatus');
        const payoutModal = document.getElementById('payoutModal');
        const adModal = document.getElementById('adModal');
        const adTimerEl = document.getElementById('adTimer');
        const historyListEl = document.getElementById('historyList');
        
        const openWithdrawModalBtn = document.getElementById('openWithdrawModal');
        const closeModalBtn = document.getElementById('closeModal');
        const submitPayoutBtn = document.getElementById('submitPayout');
        
        const usernameInput = document.getElementById('username');
        const altaAmountInput = document.getElementById('altaAmount');
        const tonAddressInput = document.getElementById('tonAddress');
        const addressError = document.getElementById('addressError');

        // Fetch Telegram Username
        if (tg && tg.initDataUnsafe?.user?.username) {
            usernameInput.value = "@" + tg.initDataUnsafe.user.username;
        }

        // Network Status Check
        function checkNetworkStatus() {
            if (!navigator.onLine) {
                systemStatus.innerText = "System: Offline (Mining Disabled)";
                systemStatus.style.color = "#e74c3c";
                return false;
            } else {
                systemStatus.innerText = "System: Operational";
                systemStatus.style.color = "#2ec4b6";
                return true;
            }
        }
        window.addEventListener('online', checkNetworkStatus);
        window.addEventListener('offline', checkNetworkStatus);

        // 15-second Ad Logic
        function trigger15SecAd(onComplete) {
            isAdShowing = true;
            adModal.style.display = 'flex';
            let timeLeft = 15;
            adTimerEl.innerText = timeLeft;

            let adInterval = setInterval(() => {
                timeLeft--;
                adTimerEl.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(adInterval);
                    adModal.style.display = 'none';
                    isAdShowing = false;
                    onComplete();
                }
            }, 1000);
        }

        // Tap & Mining Logic (0.00 to +1.00 over 10 Seconds)
        tapBtn.addEventListener('click', (e) => {
            if (!checkNetworkStatus()) {
                alert("Internet connection required!");
                return;
            }

            if (isMining || isAdShowing) return;

            // Anti-Auto Clicker Security
            if (e.isTrusted === false) {
                alert("Automated clicks detected!");
                return;
            }

            isMining = true;
            tapBtn.classList.add('mining');
            tapInstruction.innerText = "Mining Alta in progress...";

            let targetAlta = currentAlta + 1.00;
            let totalSteps = 20; // 0.05 step -> 20 increments per +1.00 ALTA
            let stepInterval = 10000 / totalSteps; // 10,000ms (10sec) / 20 = 500ms per step

            let stepCount = 0;
            let interval = setInterval(() => {
                stepCount++;
                currentAlta = parseFloat((currentAlta + 0.05).toFixed(2));
                balanceEl.innerText = currentAlta.toFixed(2);

                if (stepCount >= totalSteps) {
                    clearInterval(interval);
                    currentAlta = parseFloat(targetAlta.toFixed(2));
                    balanceEl.innerText = currentAlta.toFixed(2);
                    tapBtn.classList.remove('mining');
                    isMining = false;

                    // Trigger 15 Sec Ad right after completing 1.00 ALTA increment
                    trigger15SecAd(() => {
                        tapInstruction.innerText = "Tap to mine Alta again!";
                    });
                }
            }, stepInterval);
        });

        // Open Withdrawal Modal
        openWithdrawModalBtn.addEventListener('click', () => {
            if (!checkNetworkStatus()) {
                alert("Internet connection required!");
                return;
            }
            if (currentAlta <= 0) {
                alert("Your balance is 0. Please mine Alta first.");
                return;
            }
            altaAmountInput.value = currentAlta.toFixed(2);
            addressError.style.display = 'none';
            payoutModal.style.display = 'flex';
        });

        // Close Modal
        closeModalBtn.addEventListener('click', () => {
            payoutModal.style.display = 'none';
        });

        // Update Withdrawal History UI
        function updateHistoryUI() {
            if (withdrawalHistory.length === 0) {
                historyListEl.innerHTML = `<div style="font-size: 11px; color: #555; text-align: center;">No withdrawal requests yet</div>`;
                return;
            }

            historyListEl.innerHTML = withdrawalHistory.map(item => `
                <div class="history-item">
                    <span>${item.amount} ALTA</span>
                    <span class="badge-pending">Pending</span>
                </div>
            `).join('');
        }

        // Submit Payout Request
        submitPayoutBtn.addEventListener('click', () => {
            const address = tonAddressInput.value.trim();
            const username = usernameInput.value.trim();

            const tonRegex = /^(UQ|EQ)[a-zA-Z0-9_-]{46}$/;

            if (!tonRegex.test(address)) {
                addressError.style.display = 'block';
                return;
            }

            addressError.style.display = 'none';
            let withdrawAmount = currentAlta;

            // Deduct Points
            currentAlta = 0.00;
            balanceEl.innerText = "0.00";

            // Save to History
            withdrawalHistory.unshift({
                amount: withdrawAmount.toFixed(2),
                address: address,
                status: 'Pending'
            });
            updateHistoryUI();

            // Alert Notification & Telegram Admin Target Redirection
            alert(`Payout Request Sent Successfully!\n\nUser: ${username}\nAmount: ${withdrawAmount.toFixed(2)} ALTA\nStatus: Pending\n\nRedirecting to Telegram Channel: @AltaHub_ads_withdraw_history`);
            
            payoutModal.style.display = 'none';

            // Open Withdrawal History Telegram Channel
            if (tg) {
                tg.openTelegramLink("https://t.me/AltaHub_ads_withdraw_history");
            } else {
                window.open("https://t.me/AltaHub_ads_withdraw_history", "_blank");
            }
        });
    </script>
</body>
</html>
