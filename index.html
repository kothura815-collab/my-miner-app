<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Alta Ads Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --primary-gold: #f39c12;
            --accent-blue: #0088cc;
            --btn-green: #2fa65a;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        .miner-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            width: 85%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }

        .title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .balance-display {
            font-size: 42px;
            font-weight: bold;
            color: var(--primary-gold);
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(243, 156, 18, 0.3);
        }

        .status {
            font-size: 13px;
            color: #2ec4b6;
            margin-bottom: 25px;
        }

        /* Animated Glowing Logo Frame */
        .logo-container {
            width: 170px;
            height: 170px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            background: linear-gradient(145deg, #0088cc, #f39c12);
            padding: 5px;
            box-shadow: 0 0 20px rgba(0, 136, 204, 0.4);
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .logo-container:active {
            transform: scale(0.95);
        }

        .logo-inner {
            width: 100%;
            height: 100%;
            background-color: #0b0e14;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .logo-icon {
            font-size: 60px;
            line-height: 1;
        }

        .logo-text {
            font-size: 14px;
            font-weight: bold;
            color: var(--accent-blue);
            margin-top: 5px;
            letter-spacing: 1px;
        }

        .tap-instruction {
            font-size: 14px;
            color: #8b949e;
            margin-bottom: 20px;
        }

        .btn-withdraw {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #27ae60, #2ecc71);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
        }

        /* Ads Overlay Modal */
        .ads-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(13, 17, 23, 0.95);
            border-radius: 20px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .timer-circle {
            font-size: 36px;
            font-weight: bold;
            color: var(--primary-gold);
            margin-top: 15px;
        }

        .offline-banner {
            display: none;
            background-color: #e74c3c;
            color: white;
            font-size: 12px;
            padding: 5px;
            position: fixed;
            top: 0; width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="offline-banner" id="offlineBanner">⚠️ အင်တာနက် လိုင်းမရှိပါ။ Tap နှိပ်၍ မရပါ။</div>

    <div class="miner-card">
        <div class="title">Alta Ads Miner</div>
        <div class="balance-display" id="altaBalance">1.00</div>
        <div class="status">System: Operational</div>

        <!-- Custom Logo Design -->
        <div class="logo-container" id="tapBtn">
            <div class="logo-inner">
                <div class="logo-icon">⚡</div>
                <div class="logo-text">ALTA HUB</div>
            </div>
        </div>

        <div class="tap-instruction">Tap to mine Alta</div>
        <button class="btn-withdraw" id="withdrawBtn">💳 Withdraw Alta</button>

        <!-- Ads Display Screen -->
        <div class="ads-overlay" id="adsOverlay">
            <h3>📺 Sponsor Ad Loading...</h3>
            <p style="font-size: 12px; color: #8b949e; width: 80%;">ကျေးဇူးပြု၍ ၁၅ စက္ကန့် စောင့်ပေးပါ...</p>
            <div class="timer-circle" id="adsTimer">15</div>
        </div>
    </div>

    <script>
        // Telegram WebApp Init
        const tg = window.Telegram?.WebApp;
        if(tg) tg.expand();

        // Variables Setup
        let currentAlta = 1.00;
        let lastTapTime = 0;
        const MIN_TAP_INTERVAL = 120; // Anti-Auto Clicker (120ms ထက် မြန်ရင် ငြင်းမည်)
        const DAILY_LIMIT = 1000;
        let todayMined = 0;

        const balanceEl = document.getElementById('altaBalance');
        const tapBtn = document.getElementById('tapBtn');
        const adsOverlay = document.getElementById('adsOverlay');
        const adsTimerEl = document.getElementById('adsTimer');
        const withdrawBtn = document.getElementById('withdrawBtn');
        const offlineBanner = document.getElementById('offlineBanner');

        // Internet Connection Check
        function updateOnlineStatus() {
            if (!navigator.onLine) {
                offlineBanner.style.display = 'block';
            } else {
                offlineBanner.style.display = 'none';
            }
        }
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);

        // Tap Logic with Ads trigger
        tapBtn.addEventListener('click', (e) => {
            // 1. Internet Check
            if (!navigator.onLine) {
                alert("အင်တာနက်မရှိသေးပါ။ ချက်ချင်းပြန်မရသေးပါ။");
                return;
            }

            // 2. Anti-Auto Clicker Check
            const now = Date.now();
            if (now - lastTapTime < MIN_TAP_INTERVAL) {
                console.warn("Auto clicker detected!");
                return; 
            }
            lastTapTime = now;

            // 3. Daily Limit Check
            if (todayMined >= DAILY_LIMIT) {
                alert("ဒီနေ့အတွက် One Day Limit (1000 ALTA) ပြည့်သွားပါပြီ။");
                return;
            }

            // 4. Increment by 0.05
            currentAlta = parseFloat((currentAlta + 0.05).toFixed(2));
            todayMined += 0.05;
            balanceEl.innerText = currentAlta.toFixed(2);

            // 5. Check integer complete (e.g., 2.00, 3.00, etc.) to show 15 sec Ads
            // Checking if decimal part is zero or target whole number reached
            if (Math.abs(currentAlta % 1) < 0.01) {
                triggerAds();
            }
        });

        // 15 Sec Ads Logic
        function triggerAds() {
            adsOverlay.style.display = 'flex';
            let timeLeft = 15;
            adsTimerEl.innerText = timeLeft;

            const countdown = setInterval(() => {
                timeLeft--;
                adsTimerEl.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    adsOverlay.style.display = 'none';
                    
                    // Random Gift Code Award (1 to 10 score)
                    let giftScore = Math.floor(Math.random() * 10) + 1;
                    alert(`Ads ကြည့်ပြီးသည့်အတွက် Gift Bonus (Score: ${giftScore}/10) ရရှိပါသည်။`);
                }
            }, 1000);
        }

        // Withdraw Logic
        withdrawBtn.addEventListener('click', () => {
    const FEE_PERCENT = 10;

    if (currentAlta <= 0) {
        alert("ထုတ်ယူရန် Alta လက်ကျန်မရှိပါ။");
        return;
    }

    let fee = (currentAlta * FEE_PERCENT) / 100;
    let netAmount = currentAlta - fee;
    
    alert(`Withdraw တောင်းဆိုမှု အောင်မြင်ပါသည်။\nထုတ်ယူငွေ: ${currentAlta.toFixed(2)} ALTA\nFee (10%): ${fee.toFixed(2)} ALTA\nလက်ခံရရှိမည်: ${netAmount.toFixed(2)} ALTA`);
    
    // ထုတ်ယူပြီးပါက Balance ကို 0 ပြန်လုပ်လိုပါက အောက်ပါလိုင်းကို ဖွင့်ပေးပါ
    // currentAlta = 0;
    // balanceEl.innerText = "0.00";
});

    </script>
</body>
</html>
